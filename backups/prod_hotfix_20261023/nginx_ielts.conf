server {
    listen 80;
    listen [::]:80;
    server_name training.oyenglish.com.cn www.training.oyenglish.com.cn;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name training.oyenglish.com.cn www.training.oyenglish.com.cn;

    ssl_certificate /etc/letsencrypt/live/training.oyenglish.com.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/training.oyenglish.com.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location ^~ /tinglidanciceshi/audio/ {
        root /var/www/ielts/sources;
        access_log off;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        add_header X-Audio-Source nginx always;
        try_files $uri =404;
    }

    location ^~ /kouyulianxi/audio/ {
        root /var/www/ielts/sources;
        access_log off;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        add_header X-Audio-Source nginx always;
        try_files $uri =404;
    }

    location ^~ /kouyulianxi/complex-audio/ {
        root /var/www/ielts/sources;
        access_log off;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        add_header X-Audio-Source nginx always;
        try_files $uri =404;
    }

    location ^~ /daanjutingxie/A听力答案句/ {
        root /var/www/ielts/sources;
        access_log off;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        add_header X-Audio-Source nginx always;
        try_files $uri =404;
    }

    location ~* ^/P4gendu/.+\.(mp3|wav|m4a|ogg)$ {
        root /var/www/ielts/sources;
        access_log off;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        add_header X-Audio-Source nginx always;
        try_files $uri =404;
    }

    location /api/p4/ {
        client_max_body_size 32m;
        client_body_timeout 300s;
        proxy_pass http://127.0.0.1:49182;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
    }

    location / {
        proxy_pass http://127.0.0.1:49182;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
    }
}
