<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>听力答案句练习</title><style>
  :root {
    --brand: #5c6bc0;
    --brand-deep: #3949ab;
    --brand-light: #e8eaf6;
    --accent: #7e57c2;
    --bg: #f4f5f9;
    --surface: #ffffff;
    --surface-2: #f8f9fc;
    --border: #e2e4ec;
    --text-primary: #1a1d2e;
    --text-secondary: #6b7280;
    --text-muted: #9ca3af;
    --success: #10b981;
    --success-bg: #ecfdf5;
    --success-text: #065f46;
    --danger: #ef4444;
    --danger-bg: #fef2f2;
    --danger-text: #991b1b;
    --warning-bg: #fffbeb;
    --warning-text: #92400e;
    --radius-sm: 8px;
    --radius: 14px;
    --radius-lg: 20px;
    --shadow: 0 4px 16px rgba(92,107,192,.10), 0 1px 4px rgba(0,0,0,.06);
    --shadow-lg: 0 12px 40px rgba(92,107,192,.14), 0 2px 8px rgba(0,0,0,.06);
    --transition: 0.18s ease;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei',
                 system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text-primary);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    line-height: 1.6;
  }

  /* ===== 首页 ===== */
  #home {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 48px 24px;
  }
  #home h1 {
    font-size: 1.8rem;
    font-weight: 700;
    color: var(--text-primary);
    margin-bottom: 8px;
    letter-spacing: -.01em;
  }
  #home p.sub {
    color: var(--text-secondary);
    margin-bottom: 36px;
    font-size: .92rem;
  }

  /* 分组格 */
  .group-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
    max-width: 700px;
    width: 100%;
  }
  .group-btn {
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    padding: 18px 10px;
    cursor: pointer;
    text-align: center;
    transition: border-color var(--transition), transform var(--transition), box-shadow var(--transition);
    position: relative;
  }
  .group-btn:hover {
    border-color: var(--brand);
    background: var(--brand-light);
    transform: translateY(-2px);
    box-shadow: var(--shadow);
  }
  .group-btn .g-title {
    font-size: .9rem;
    font-weight: 700;
    color: var(--text-primary);
    margin-bottom: 4px;
  }
  .group-btn .g-count { font-size: .75rem; color: var(--text-muted); }
  .group-btn .g-score {
    margin-top: 6px;
    font-size: .78rem;
    font-weight: 600;
    color: var(--brand);
  }
  .group-btn.done { border-color: var(--success); }
  .group-btn.done .g-title { color: var(--success); }

  /* ===== 答题区 ===== */
  #quiz {
    display: none;
    flex-direction: column;   /* 修复：强制竖向排列 */
    max-width: 720px;
    margin: 0 auto;
    padding: 0 16px 48px;
    width: 100%;
  }

  .quiz-header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 16px 20px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .back-btn {
    background: none;
    border: 1.5px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 6px 12px;
    cursor: pointer;
    font-size: .88rem;
    color: var(--text-secondary);
    font-family: inherit;
    transition: background var(--transition), color var(--transition);
  }
  .back-btn:hover { background: var(--surface-2); color: var(--text-primary); }
  .quiz-title {
    font-weight: 700;
    font-size: 1rem;
    color: var(--text-primary);
    flex: 1;
  }
  .progress-text { font-size: .82rem; color: var(--text-muted); }

  .progress-bar-wrap {
    height: 4px;
    background: var(--border);
    overflow: hidden;
  }
  .progress-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--brand), var(--accent));
    transition: width .4s cubic-bezier(.4,0,.2,1);
  }

  /* 题卡 */
  .card {
    background: var(--surface);
    border-radius: var(--radius-lg);
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
    padding: 28px 30px;
    max-width: 660px;
    margin: 24px auto;
  }

  /* 音频区 */
  .audio-area {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    margin-bottom: 22px;
  }
  .play-btn {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background: var(--brand);
    color: #fff;
    border: none;
    font-size: 1.6rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background var(--transition), transform var(--transition), box-shadow var(--transition);
  }
  .play-btn:hover {
    background: var(--brand-deep);
    transform: scale(1.06);
    box-shadow: 0 6px 20px rgba(92,107,192,.35);
  }
  .play-btn.speaking {
    background: var(--accent);
    animation: pulse 1.2s infinite;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(126,87,194,.4); }
    50%       { box-shadow: 0 0 0 10px rgba(126,87,194,.0); }
  }
  .audio-hint {
    font-size: .8rem;
    color: var(--text-muted);
    text-align: center;
    line-height: 1.5;
  }
  .audio-hint strong {
    color: var(--brand);
    font-size: .82rem;
    display: block;
    margin-bottom: 2px;
  }

  /* 原文显示 */
  #originalText {
    display: none;
    margin: 14px 0;
    padding: 12px 16px;
    background: var(--surface-2);
    border-radius: var(--radius-sm);
    border-left: 3px solid var(--brand);
    font-size: .9rem;
    color: var(--text-secondary);
    line-height: 1.7;
  }
  #originalText.show { display: block; }
  #originalText label {
    font-size: .75rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .04em;
    color: var(--brand);
    display: block;
    margin-bottom: 6px;
  }

  /* 填空题 */
  .blank-sentence {
    font-size: 1rem;
    line-height: 1.9;
    color: var(--text-primary);
    margin-bottom: 18px;
    padding: 14px 18px;
    background: var(--surface-2);
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
  }
  .blank { color: var(--brand); font-weight: 700; }

  /* 选项 */
  .options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }
  .option-btn {
    background: var(--surface-2);
    border: 1.5px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 11px 16px;
    text-align: left;
    cursor: pointer;
    font-size: .9rem;
    font-family: inherit;
    color: var(--text-primary);
    transition: border-color var(--transition), background var(--transition);
  }
  .option-btn:hover { border-color: var(--brand); background: var(--brand-light); }
  .option-btn.selected { border-color: var(--brand); background: var(--brand-light); color: var(--brand-deep); font-weight: 600; }
  .option-btn.correct  { border-color: var(--success); background: var(--success-bg); color: var(--success-text); }
  .option-btn.wrong    { border-color: var(--danger);  background: var(--danger-bg);  color: var(--danger-text); }
  .option-btn:disabled { cursor: default; }

  /* 反馈 */
  #feedback {
    min-height: 40px;
    padding: 10px 16px;
    border-radius: var(--radius-sm);
    font-size: .9rem;
    font-weight: 600;
    margin-bottom: 14px;
    display: none;
  }
  #feedback.show { display: block; }
  #feedback.correct { background: var(--success-bg); color: var(--success-text); border: 1px solid #a7f3d0; }
  #feedback.wrong   { background: var(--danger-bg);  color: var(--danger-text);  border: 1px solid #fca5a5; }

  /* 按钮 */
  .btn {
    background: var(--brand);
    color: #fff;
    border: none;
    padding: 10px 26px;
    font-size: .95rem;
    font-family: inherit;
    font-weight: 600;
    border-radius: var(--radius);
    cursor: pointer;
    transition: background var(--transition), transform var(--transition), box-shadow var(--transition);
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .btn:hover { background: var(--brand-deep); transform: translateY(-1px); box-shadow: 0 6px 18px rgba(92,107,192,.28); }
  .btn:disabled { opacity: .5; cursor: not-allowed; transform: none; box-shadow: none; }
  .btn-next {
    background: var(--brand);
    display: block;
    width: 100%;
    padding: 12px;
    font-size: .95rem;
    text-align: center;
    margin-top: 6px;
  }
  .btn-next:hover { background: var(--brand-deep); }

  /* 结果页 */
  #result { display: none; }
  .result-card {
    background: var(--surface);
    border-radius: var(--radius-lg);
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
    padding: 36px 30px;
    max-width: 560px;
    margin: 40px auto;
    text-align: center;
  }
  .result-card h2 { font-size: 1.5rem; font-weight: 700; margin-bottom: 8px; }
  .result-score {
    font-size: 3.5rem;
    font-weight: 800;
    color: var(--brand);
    line-height: 1;
    margin: 18px 0 6px;
  }
  .result-detail { color: var(--text-secondary); font-size: .9rem; margin-bottom: 20px; }
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin: 18px 0;
  }
  .stat-box {
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 14px 8px;
  }
  .stat-value { font-size: 1.5rem; font-weight: 800; color: var(--brand); }
  .stat-label { font-size: .75rem; color: var(--text-muted); margin-top: 4px; }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(8px);
    background: var(--text-primary);
    color: #fff;
    padding: 10px 22px;
    border-radius: 999px;
    z-index: 2000;
    font-size: .88rem;
    font-weight: 500;
    opacity: 0;
    transition: opacity .25s, transform .25s;
    pointer-events: none;
    white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.error   { background: var(--danger); }
  .toast.success { background: var(--success); }

  /* ===== 选项网格 ===== */
  .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }

  /* ===== 选项按钮 ===== */
  .opt-btn {
    background: var(--surface-2);
    border: 1.5px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 11px 16px;
    text-align: left;
    cursor: pointer;
    font-size: .9rem;
    font-family: inherit;
    color: var(--text-primary);
    transition: border-color var(--transition), background var(--transition);
    display: flex;
    align-items: flex-start;
    gap: 10px;
  }
  .opt-btn:hover:not(:disabled) { border-color: var(--brand); background: var(--brand-light); }
  .opt-btn .opt-letter {
    width: 24px; height: 24px;
    border-radius: 50%; flex-shrink: 0;
    background: var(--border); color: var(--text-secondary);
    font-weight: 700; font-size: .78rem;
    display: flex; align-items: center; justify-content: center;
  }
  .opt-btn.selected { border-color: var(--brand); background: var(--brand-light); }
  .opt-btn.selected .opt-letter { background: var(--brand); color: #fff; }
  .opt-btn.correct { border-color: var(--success); background: var(--success-bg); color: var(--success-text); }
  .opt-btn.correct .opt-letter { background: var(--success); color: #fff; }
  .opt-btn.wrong { border-color: var(--danger); background: var(--danger-bg); color: var(--danger-text); }
  .opt-btn.wrong .opt-letter { background: var(--danger); color: #fff; }
  .opt-btn:disabled { cursor: default; }

  /* ===== 改写表达区域 ===== */
  .para-label {
    font-size: .75rem; color: var(--text-muted);
    font-weight: 600; letter-spacing: .05em;
    text-transform: uppercase; margin-bottom: 8px;
  }
  .para-text {
    font-size: 1rem; line-height: 1.85;
    color: var(--text-primary); margin-bottom: 18px;
    padding: 14px 18px;
    background: var(--surface-2);
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
  }

  /* ===== 空格单词 ===== */
  .blank-word {
    display: inline-block; min-width: 120px;
    border-bottom: 2px solid var(--brand);
    color: transparent; background: var(--brand-light);
    border-radius: 4px; padding: 0 8px; margin: 0 4px;
    vertical-align: middle;
  }
  .blank-word.correct-reveal { color: var(--success-text); background: var(--success-bg); border-bottom-color: var(--success); font-weight: 600; }
  .blank-word.wrong-reveal   { color: var(--danger-text);  background: var(--danger-bg);  border-bottom-color: var(--danger); }

  /* ===== 下一题按钮 ===== */
  .next-btn {
    display: none;
    background: var(--brand); color: #fff;
    border: none; padding: 12px;
    font-size: .95rem; font-family: inherit; font-weight: 600;
    border-radius: var(--radius); cursor: pointer;
    width: 100%; text-align: center; margin-top: 6px;
    transition: background var(--transition);
  }
  .next-btn:hover { background: var(--brand-deep); }

  /* ===== 分组按钮内部元素 ===== */
  .group-btn .gscore { font-size: .78rem; font-weight: 600; color: var(--brand); min-height: 16px; }
  .group-btn .gnum   { font-size: .92rem; font-weight: 700; color: var(--text-primary); margin: 4px 0 2px; }
  .group-btn .glabel { font-size: .72rem; color: var(--text-muted); }

  /* ===== 结果页 ===== */
  #result {
    display: none; flex-direction: column;
    align-items: center; padding: 40px 24px; text-align: center;
  }
  .result-emoji  { font-size: 1.5rem; font-weight: 700; color: var(--text-primary); margin-bottom: 8px; }
  .result-score  { font-size: 3.5rem; font-weight: 800; color: var(--brand); line-height: 1; margin: 18px 0 6px; }
  .result-label  { color: var(--text-secondary); font-size: .9rem; margin-bottom: 20px; }
  .result-btn {
    padding: 13px 40px; border-radius: var(--radius); border: none;
    cursor: pointer; font-size: .95rem; font-weight: 600;
    margin: 6px; font-family: inherit; transition: background var(--transition);
  }
  .result-btn.primary  { background: var(--brand); color: #fff; }
  .result-btn.primary:hover { background: var(--brand-deep); }
  .result-btn.secondary { background: transparent; border: 1.5px solid var(--border); color: var(--text-secondary); }
  .result-btn.secondary:hover { background: var(--surface-2); }

  /* ===== 响应式 ===== */
  @media (max-width: 560px) {
    .card { padding: 20px 16px; margin: 14px 12px; }
    .group-grid { grid-template-columns: repeat(3, 1fr); }
    .options-grid { grid-template-columns: 1fr; }
  }
</style></head><body><!-- HOME --><div id="home"><h1>听力答案句练习</h1><p class="sub">选择一个练习组，每组 10 题</p><div class="group-grid" id="groupGrid"></div></div><!-- QUIZ --><div id="quiz"><div class="quiz-header"><button class="back-btn" onclick="goHome()">&#8592; 返回</button><span class="quiz-title" id="quizTitle"></span><span class="progress-text" id="progressText"></span></div><div class="progress-bar-wrap"><div class="progress-bar-fill" id="progressFill" style="width:0%"></div></div><div class="card"><div class="audio-area"><button class="play-btn" id="playBtn" onclick="playAudio()">&#9654;</button><div class="audio-hint"><strong>点击播放原句录音</strong>
        选出下方改写句中空格处对应的替换词<br><span style="color:#c07a30;">（播放第4遍时自动显示原文）</span></div></div><div class="original-text" id="originalText"><div class="label">原文</div><span id="originalContent"></span></div><div class="para-label">改写表达</div><div class="para-text" id="paraText"></div></div><div class="options-wrap"><div class="options-grid" id="optionsGrid"></div></div><div class="feedback" id="feedback"></div><button class="next-btn" id="nextBtn" onclick="nextQuestion()">下一题 &#8594;</button></div><!-- RESULT --><div id="result"><div class="result-emoji" id="resultEmoji"></div><div class="result-score" id="resultScore"></div><div class="result-label" id="resultLabel"></div><div><button class="result-btn primary" onclick="retryGroup()">再练一次</button><button class="result-btn secondary" onclick="goHome()">返回主页</button></div></div><script>
const GROUPS = [[{"id":1,"original":"There are marked trails, but you can also leave these and go off on your own and that's an experience not to be missed.","paraphrase":"There are clearly marked paths to follow, but you can also get away from regular trails and explore alone — that's something you really shouldn't miss.","blank":"There are clearly marked paths to follow, but you can also ______ and explore alone — that's something you really shouldn't miss.","answer":"get away from regular trails","options":["get away from regular trails","take a different route","stay on the main road","find your own way back"],"correct_idx":0,"audio_file":"A听力答案句/1%20%20There%20are%20marked%20trails%2C%20but%20you%20can%20also%20leave%20these%20and%20go%20off%20on%20your%20own%20and%20that%27s%20an%20experience%20not%20to%20be%20missed..mp3"},{"id":2,"original":"If you want, you can have your own team for the afternoon and learn how to drive them.","paraphrase":"If you're interested, you can get your own group in the afternoon and learn to drive a team of dogs.","blank":"If you're interested, you can get your own group in the afternoon and learn ______.","answer":"to drive a team of dogs","options":["to lead a group hike","to join the guide's team","to drive a team of dogs","to ride a horse alone"],"correct_idx":2,"audio_file":"A听力答案句/2%20%20If%20you%20want%2C%20you%20can%20have%20your%20own%20team%20for%20the%20afternoon%20and%20learn%20how%20to%20drive%20them..mp3"},{"id":3,"original":"There's a medal for everyone who takes part.","paraphrase":"Every person who joins in gets a medal — so all participants will receive one.","blank":"Every person who joins in gets a medal — so ______ will receive one.","answer":"all participants","options":["all participants","some lucky winners","the top performers","a few selected members"],"correct_idx":0,"audio_file":"A听力答案句/3%20%20There%27s%20a%20medal%20for%20everyone%20who%20takes%20part..mp3"},{"id":4,"original":"It's a long ascent, though not too steep, and walkers generally take a couple of days to get to the summit.","paraphrase":"The climb is quite long, but not very steep, and most people take about two days to get to the summit.","blank":"The climb is quite long, but not very steep, and most people take about two days to ______.","answer":"get to the summit","options":["return to the base","reach the starting point","get to the summit","follow the guide downhill"],"correct_idx":2,"audio_file":"A听力答案句/4%20%20It%27s%20a%20long%20ascent%2C%20though%20not%20too%20steep.%20and%20walkers%20generally%20take%20a%20couple%20of%20days%20to%20get%20to%20the%20summit..mp3"},{"id":5,"original":"In that case, stay in the hut — generally the storms don't last long.","paraphrase":"If that happens, just wait in the hut — the storms usually pass quickly.","blank":"If that happens, just ______ in the hut — the storms usually pass quickly.","answer":"wait","options":["leave the area","move to higher ground","wait","call for help"],"correct_idx":2,"audio_file":"A听力答案句/5%20%20In%20that%20case%2C%20stay%20in%20the%20hut-%20generally%20the%20storms%20don%27t%20last%20long.%20.mp3"},{"id":6,"original":"This trail's been designed to give first-timers an experience they'll enjoy regardless of their age or skill.","paraphrase":"This path is made for beginners to have a great time, and it's suitable for all abilities, no matter how old you are.","blank":"This path is made for beginners to have a great time, and it's ______, no matter how old you are.","answer":"suitable for all abilities","options":["suitable for all abilities","for experts only","requires previous training","only for adults"],"correct_idx":0,"audio_file":"A听力答案句/6%20%20This%20trail%27s%20been%20designed%20to%20give%20first-timers%20an%20experience%20they%27ll%20enjoy%20regardless%20of%20their%20age%20or%20skill..mp3"},{"id":7,"original":"But if you've fully mastered the techniques needed for hills, it's great fun.","paraphrase":"However, it demands a lot of skill with hill-climbing techniques, and once you've got those down, it's really enjoyable.","blank":"However, it ______ with hill-climbing techniques, and once you've got those down, it's really enjoyable.","answer":"demands a lot of skill","options":["demands a lot of skill","is easy for beginners","needs no preparation","requires no practice"],"correct_idx":0,"audio_file":"A听力答案句/7%20%20But%20if%20you%27ve%20fully%20mastered%20the%20techniques%20needed%20for%20hills%2C%20it%27s%20great%20fun..mp3"},{"id":8,"original":"There's a shelter half-way where you can sit and take a break.","paraphrase":"Halfway along, there's a covered spot where you can stop and rest for a while.","blank":"Halfway along, there's a covered spot where you can ______ for a while.","answer":"stop and rest","options":["keep moving forward","check your equipment","stop and rest","speed up the pace"],"correct_idx":2,"audio_file":"A听力答案句/8%20%20There%27s%20a%20shelter%20half-way%20where%20you%20can%20sit%20and%20take%20a%20break..mp3"},{"id":9,"original":"If it's snowing or windy, check with us before you set out to make sure the trail's open that day.","paraphrase":"If the weather turns snowy or windy, ask us before heading out — the trail may be closed that day.","blank":"If the weather turns snowy or windy, ask us before heading out — the trail ______ that day.","answer":"may be closed","options":["is always open","needs a booking","closes at noon","may be closed"],"correct_idx":3,"audio_file":"A听力答案句/9%20%20If%20it%27s%20snowing%20or%20windy%2C%20check%20with%20us.%20before%20you%20set%20out%20to%20make%20sure%20the%20trail%27s%20open%20that%20day..mp3"},{"id":10,"original":"Because they felt they were doing something really useful, nearly everyone agreed that volunteering made them feel more motivated at work.","paraphrase":"Since they felt their work was useful, almost all of them said that volunteering made them feel more motivated at their jobs.","blank":"Since they felt their work s about events — for instance, the ______ something happened and other facts like the place.","answer":"time","options":["time","result","reason","place"],"correct_idx":0,"audio_file":"A听力答案句/29%20%20Episodic%20memories%20include%20various%20details%20about%20these%20events%2C%20for%20example%2C%20when%20an%20event%20happened%20and%20other%20information%20such%20as%20the%20location..mp3"},{"id":30,"original":"That is your general knowledge of the world.","paraphrase":"That refers to your general information — what you know about the world.","blank":"That refers to your general ______ — what you know about the world.","answer":"information","options":["feeling","opinion","information","memory"],"correct_idx":2,"audio_file":"A听力答案句/30%20%20That%20is%20your%20general%20knowledge%20of%20the%20world..mp3"}],[{"id":31,"original":"Semantic memory isn't dependent on recalling personal experiences.","paraphrase":"Semantic memory doesn't involve remembering things that happened to you personally.","blank":"Semantic memory doesn't ______ remembering things that happened to you personally.","answer":"involve","options":["require","involve","be separate from","depend heavily on"],"correct_idx":1,"audio_file":"A听力答案句/31%20%20Semantic%20memory%20isn%27t%20dependent%20on%20recalling%20personal%20experiences..mp3"},{"id":32,"original":"The degree to which you can successfully encode information depends on the level of attention you give to an event while it's actually happening.","paraphrase":"The more attention you pay to something while it's happening, the more successfully you can store it in your memory.","blank":"The more attention you pay to something while it's happening, the more successfully you can store it in your memory — ______","answer":"the more A, the more B","options":["B is unrelated to A","A and B are the same","the more A, the more B","the less A, the more B"],"correct_idx":2,"audio_file":"A听力答案句/32%20%20The%20degree%20to%20which%20you%20can%20successfully%20enco ked%20your%20car%20you%20may%20use%20the%20colour%20of%20a%20sign%20close%20to%20where%20you%20parked.mp3"},{"id":36,"original":"Recent studies have shown that computer-assisted games designed to keep the brain active can help improve their episodic memory.","paraphrase":"New research shows that computer games made to stimulate the brain can help older people improve their episodic memory.","blank":"New research shows that computer games made to ______ the brain can help older people improve their episodic memory.","answer":"stimulate","options":["entertain","stimulate","slow down","replace"],"correct_idx":1,"audio_file":"A听力答案句/36%20%20Recent%20studies%20have%20shown%20that%20computer-assisted%20games%20designed%20to%20keep%20the%20brain%20active%20can%20help%20improve%20their%20episodic%20memory..mp3"},{"id":37,"original":"This may be caused by an absence of a sense of self.","paraphrase":"This might happen because the concept of self is absent — they lack a clear sense of who they are.","blank":"This might happen because the ______ of self is absent — they lack a clear sense of who they are.","answer":"concept","options":["disappear / emotion","concept","exist / awareness","be present / feeling"],"correct_idx":1,"audio_file":"A听力答案句/37%20%20This%20may%20be%20caused%20by%20an%20absence%20of%20a%20sense%20of%20self..mp3"},{"id":38,"original":"In 1623, the ruler of Constantinople demanded the destruction of all the coffee houses in the city.","paraphrase":"In 1623, the leader of Constantinople ordered that every coffee house in the city be torn down.","blank":"In 1623, the leader of Constantinople ______ed that every coffee house in the city be torn down.","answer":"order","options":["allow","request","suggest","order"],"correct_idx":3,"audio_file":"A听力答案句/38%20%20In%201623%2C%20the%20ruler%20of%20Constantinople%20demanded%20the%20destruction%20of%20all%20the%20coffee%20houses%20in%20the%20city..mp3"},{"id":39,"original":"Because of this, some people said that these _idx":0,"audio_file":"A听力答案句/119%20%20The%20gym%20will%20be%20available%2C%20though%2C%20at%20no%20extra%20charge..mp3"},{"id":120,"original":"There is a small additional payment for those.","paraphrase":"There is a small extra charge for those items.","blank":"There is a small ______ for those items.","answer":"extra charge","options":["group discount","extra charge","full refund","free upgrade"],"correct_idx":1,"audio_file":"A听力答案句/120%20%20there%20is%20a%20small%20additional%20payment%20for%20those..mp3"}]];

let currentGroup = 0;
let currentQ = 0;
let score = 0;
let answered = false;
let playCount = 0;
const synth = window.speechSynthesis;
let groupScores = JSON.parse(localStorage.getItem('ieltsListenScores') || '{}');
const LETTERS = ['A','B','C','D'];
let singleQuestionMode = false;

function renderHome() {
  const grid = document.getElementById('groupGrid');
  grid.innerHTML = '';
  GROUPS.forEach(function(g, i) {
    const btn = document.createElement('div');
    const isDone = groupScores[i] === 10;
    btn.className = 'group-btn' + (isDone ? ' done' : '');
    const sc = groupScores[i] !== undefined ? groupScores[i] + '/10' : '';
    btn.innerHTML =
      '<div class="gscore">' + sc + '</div>' +
      '<div class="gnum">第 ' + (i+1) + ' 组</div>' +
      '<div class="glabel">Q' + (i*10+1) + ' &ndash; Q' + (i*10+10) + '</div>';
    btn.addEventListener('click', function() { startGroup(i); });
    grid.appendChild(btn);
  });
}

function goHome() {
  singleQuestionMode = false;
  synth.cancel();
  if (currentAudio) { currentAudio.pause(); currentAudio = null; }
  document.getElementById('home').style.display = 'flex';
  document.getElementById('quiz').style.display = 'none';
  document.getElementById('result').style.display = 'none';
  renderHome();
}

function startGroup(groupIdx) {
  singleQuestionMode = false;
  currentGroup = groupIdx;
  currentQ = 0;
  score = 0;
  document.getElementById('home').style.display = 'none';
  document.getElementById('quiz').style.display = 'flex';
  document.getElementById('result').style.display = 'none';
  document.getElementById('quizTitle').textContent = '第 ' + (groupIdx+1) + ' 组';
  loadQuestion();
}

function loadQuestion() {
  answered = false;
  playCount = 0;
  synth.cancel();
  if (currentAudio) {
    currentAudio.pause();
    currentAudio.currentTime = 0;
    currentAudio = null;
  }

  const q = GROUPS[currentGroup][currentQ];
  const total = singleQuestionMode ? 1 : GROUPS[currentGroup].length;
  const displayNum = singleQuestionMode ? 1 : (currentQ + 1);

  document.getElementById('progressText').textContent = displayNum + ' / ' + total;
  document.getElementById('progressFill').style.width = (currentQ / total * 100) + '%';

  const playBtn = document.getElementById('playBtn');
  playBtn.classList.remove('speaking');
  playBtn.innerHTML = '&#9654;';

  document.getElementById('originalText').classList.remove('show');
  document.getElementById('originalContent').textContent = '';

  const paraEl = document.getElementById('paraText');
  const blankHtml = q.blank.replace('______',
    '<span class="blank-word" id="blankSpan">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span>');
  paraEl.innerHTML = blankHtml;

  const grid = document.getElementById('optionsGrid');
  grid.innerHTML = '';
  q.options.forEach(function(opt, i) {
    const btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML =
      '<span class="opt-letter">' + LETTERS[i] + '</span>' +
      '<span>' + opt + '</span>';
    btn.addEventListener('click', function() { selectOption(i, btn); });
    grid.appendChild(btn);
  });

  document.getElementById('feedback').style.display = 'none';
  document.getElementById('nextBtn').style.display = 'none';
}

// 当前播放的 Audio 对象
let currentAudio = null;

function getAudioCandidates(q) {
  if (!q.audio_file) return [];
  const candidates = [];
  const add = function(url) {
    if (url && candidates.indexOf(url) === -1) candidates.push(url);
  };
  add(q.audio_file);
  try { add(new URL(q.audio_file, window.location.href).href); } catch(e) {}
  add('https://raysu672-glitch.github.io/daanjutingxie/' + q.audio_file);
  return candidates;
}

function playAudio() {
  const q = GROUPS[currentGroup][currentQ];
  const playBtn = document.getElementById('playBtn');

  // 停止正在播放的内容
  synth.cancel();
  if (currentAudio) {
    currentAudio.pause();
    currentAudio.currentTime = 0;
    currentAudio = null;
  }

  // 如果已在播放（再次点击 = 停止）
  if (playBtn.classList.contains('speaking')) {
    playBtn.classList.remove('speaking');
    playBtn.innerHTML = '&#9654;';
    return;
  }

  // 增加播放次数，达到第4次时显示原文
  playCount++;
  if (playCount >= 4) {
    document.getElementById('originalText').classList.add('show');
    document.getElementById('originalContent').textContent = q.original;
  }

  const candidates = getAudioCandidates(q);
  if (candidates.length > 0) {
    var fallbackDone = false;
    var fallbackToTTS = function() {
      if (fallbackDone) return;
      fallbackDone = true;
      playBtn.classList.remove('speaking');
      playBtn.innerHTML = '&#9654;';
      try { if (currentAudio) currentAudio.pause(); } catch(e) {}
      currentAudio = null;
      useTTS(q.original);
    };
    var tryIndex = 0;
    var tryPlayNext = function() {
      if (fallbackDone) return;
      if (tryIndex >= candidates.length) {
        fallbackToTTS();
        return;
      }
      var audio = new Audio(candidates[tryIndex]);
      tryIndex++;
      audio.preload = 'auto';
      currentAudio = audio;
      var started = false;
      var loadTimer = setTimeout(function() {
        if (!started) {
          try { audio.pause(); } catch(e) {}
          tryPlayNext();
        }
      }, 4500);
      audio.onplaying = function() {
        started = true;
        clearTimeout(loadTimer);
        playBtn.classList.add('speaking');
        playBtn.innerHTML = '&#9724;';
      };
      audio.onended = function() {
        clearTimeout(loadTimer);
        playBtn.classList.remove('speaking');
        playBtn.innerHTML = '&#9654;';
        currentAudio = null;
      };
      audio.onerror = function() {
        clearTimeout(loadTimer);
        if (!started) tryPlayNext();
        else fallbackToTTS();
      };
      var playPromise = audio.play();
      if (playPromise !== undefined) {
        playPromise.catch(function() {
          clearTimeout(loadTimer);
          tryPlayNext();
        });
      }
    };
    tryPlayNext();
  } else {
    useTTS(q.original);
  }
}

function useTTS(text) {
  const playBtn = document.getElementById('playBtn');
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'en-GB';
  utter.rate = 0.9;
  utter.pitch = 1.0;
  utter.onstart = function() {
    playBtn.classList.add('speaking');
    playBtn.innerHTML = '&#9724;';
  };
  utter.onend = function() {
    playBtn.classList.remove('speaking');
    playBtn.innerHTML = '&#9654;';
  };
  utter.onerror = function() {
    playBtn.classList.remove('speaking');
    playBtn.innerHTML = '&#9654;';
  };
  synth.speak(utter);
}

function selectOption(idx, btnEl) {
  if (answered) return;
  answered = true;

  const q = GROUPS[currentGroup][currentQ];
  const isCorrect = (idx === q.correct_idx);
  const total = GROUPS[currentGroup].length;

  const btns = document.querySelectorAll('.opt-btn');
  btns.forEach(function(b) { b.disabled = true; });

  btnEl.classList.add(isCorrect ? 'correct' : 'wrong');
  if (!isCorrect) {
    btns[q.correct_idx].classList.add('correct');
  }

  const blankSpan = document.getElementById('blankSpan');
  if (blankSpan) {
    blankSpan.textContent = q.answer;
    blankSpan.className = 'blank-word ' + (isCorrect ? 'correct-reveal' : 'wrong-reveal');
  }

  const fb = document.getElementById('feedback');
  if (isCorrect) {
    score++;
    fb.className = 'feedback correct';
    fb.innerHTML = '<strong>正确！</strong>&nbsp;原句换了一种说法，替换词是 "<strong>' + q.answer + '</strong>"';
  } else {
    fb.className = 'feedback wrong';
    fb.innerHTML = '<strong>错误。</strong>&nbsp;正确答案是 "<strong>' + q.answer + '</strong>"';
  }
  fb.style.display = 'block';

  document.getElementById('progressFill').style.width = ((currentQ+1) / total * 100) + '%';

  const nextBtn = document.getElementById('nextBtn');
  nextBtn.style.display = 'block';
  nextBtn.innerHTML = (currentQ + 1 >= total) ? '查看结果 &#8594;' : '下一题 &#8594;';
}

function nextQuestion() {
  if (singleQuestionMode) {
    goHome();
    return;
  }
  const total = GROUPS[currentGroup].length;
  if (currentQ + 1 >= total) {
    showResult();
  } else {
    currentQ++;
    loadQuestion();
  }
}

function showResult() {
  synth.cancel();
  if (currentAudio) { currentAudio.pause(); currentAudio = null; }
  document.getElementById('quiz').style.display = 'none';
  document.getElementById('result').style.display = 'flex';

  groupScores[currentGroup] = score;
  localStorage.setItem('ieltsListenScores', JSON.stringify(groupScores));

  const pct = score / GROUPS[currentGroup].length;
  let resultText = '满分', label = '太棒了，全部答对！';
  if (pct < 0.6) { resultText = '继续练习'; label = '继续加油，多练几次就会了！'; }
  else if (pct < 0.8) { resultText = '继续提升'; label = '不错！还有进步空间，再练一次？'; }
  else if (pct < 1.0) { resultText = '接近满分'; label = '非常好！差一点就满分了！'; }

  document.getElementById('resultEmoji').textContent = resultText;
  document.getElementById('resultScore').textContent = score + ' / ' + GROUPS[currentGroup].length;
  document.getElementById('resultLabel').textContent = label;
}

function retryGroup() {
  startGroup(currentGroup);
}

renderHome();
(function tryOpenQueryQuestion() {
  try {
    var params = new URLSearchParams(window.location.search);
    var qid = parseInt(params.get('qid') || params.get('id') || '', 10);
    if (!qid) return;
    for (var g = 0; g < GROUPS.length; g++) {
      for (var i = 0; i < GROUPS[g].length; i++) {
        if (GROUPS[g][i].id === qid) {
          singleQuestionMode = true;
          currentGroup = g;
          currentQ = i;
          score = 0;
          document.getElementById('home').style.display = 'none';
          document.getElementById('quiz').style.display = 'flex';
          document.getElementById('result').style.display = 'none';
          document.getElementById('quizTitle').textContent = '错题复习';
          loadQuestion();
          return;
        }
      }
    }
  } catch (e) {}
})();
</script></body></html>
