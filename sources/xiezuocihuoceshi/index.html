<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>写作词伙 · 随机测试</title><style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
    background: #0a0e17;
    color: #e0e0e0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
  }

  .container {
    width: 100%;
    max-width: 720px;
    background: #111827;
    border-radius: 16px;
    padding: 36px 32px;
    border: 1px solid #1e293b;
    box-shadow: 0 4px 40px rgba(0,0,0,0.5);
  }

  .header {
    text-align: center;
    margin-bottom: 28px;
  }
  .header h1 {
    font-size: 22px;
    font-weight: 700;
    background: linear-gradient(135deg, #58a6ff, #bc8cff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .header .sub {
    font-size: 13px;
    color: #6b7280;
    margin-top: 4px;
  }

  /* ── 进度条 ── */
  .progress-wrap {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 24px;
  }
  .progress-bar {
    flex: 1;
    height: 6px;
    background: #1e293b;
    border-radius: 3px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #58a6ff, #bc8cff);
    border-radius: 3px;
    transition: width 0.3s;
  }
  .progress-text {
    font-size: 13px;
    color: #8b949e;
    white-space: nowrap;
    min-width: 50px;
    text-align: right;
  }

  /* ── 题目卡片 ── */
  .card {
    background: #161b22;
    border: 1px solid #21262d;
    border-radius: 12px;
    padding: 28px 24px;
    margin-bottom: 20px;
    text-align: center;
  }
  .card .zh {
    font-size: 26px;
    font-weight: 700;
    color: #f0f6fc;
    margin-bottom: 20px;
    line-height: 1.5;
  }
  .card .input-row {
    display: flex;
    gap: 10px;
    align-items: center;
  }
  .card input {
    flex: 1;
    background: #0d1117;
    border: 2px solid #30363d;
    border-radius: 8px;
    padding: 12px 16px;
    font-size: 16px;
    color: #e6edf3;
    font-family: 'Segoe UI', 'Consolas', monospace;
    outline: none;
    transition: border-color 0.2s;
  }
  .card input:focus {
    border-color: #58a6ff;
  }
  .card input.correct {
    border-color: #3fb950;
    background: #0d1f14;
  }
  .card input.wrong {
    border-color: #f85149;
    background: #1f0d0d;
  }
  .card .btn {
    padding: 12px 24px;
    background: linear-gradient(135deg, #238636, #2ea043);
    border: none;
    border-radius: 8px;
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.2s, transform 0.1s;
  }
  .card .btn:hover { opacity: 0.9; }
  .card .btn:active { transform: scale(0.97); }
  .card .btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }
  .card .btn.next {
    background: linear-gradient(135deg, #1f6feb, #58a6ff);
  }

  .card .feedback {
    margin-top: 14px;
    font-size: 14px;
    min-height: 20px;
  }
  .card .feedback.correct-msg { color: #3fb950; }
  .card .feedback.wrong-msg { color: #f85149; }

  /* ── 结果页 ── */
  .result {
    text-align: center;
    padding: 16px 0;
  }
  .result .score-circle {
    width: 140px;
    height: 140px;
    border-radius: 50%;
    border: 6px solid #30363d;
    margin: 0 auto 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    transition: border-color 0.5s;
  }
  .result .score-circle.great { border-color: #3fb950; }
  .result .score-circle.good { border-color: #58a6ff; }
  .result .score-circle.ok   { border-color: #d29922; }
  .result .score-circle.poor { border-color: #f85149; }
  .result .score-num {
    font-size: 42px;
    font-weight: 800;
    line-height: 1;
  }
  .result .score-label {
    font-size: 13px;
    color: #8b949e;
    margin-top: 4px;
  }
  .result .stats {
    display: flex;
    justify-content: center;
    gap: 32px;
    margin: 24px 0;
  }
  .result .stat b {
    display: block;
    font-size: 28px;
  }
  .result .stat span {
    font-size: 12px;
    color: #6b7280;
  }
  .result .detail-table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 20px;
    font-size: 13px;
  }
  .result .detail-table th {
    text-align: left;
    padding: 8px 12px;
    color: #6b7280;
    font-weight: 500;
    border-bottom: 1px solid #21262d;
  }
  .result .detail-table td {
    padding: 8px 12px;
    border-bottom: 1px solid #0d1117;
    vertical-align: top;
  }
  .result .detail-table tr:nth-child(even) td { background: #0d1117; }
  .result .detail-table .hit  { color: #3fb950; }
  .result .detail-table .miss { color: #f85149; }
  .result .detail-table .correct-answer {
    color: #58a6ff;
    font-family: 'Consolas', monospace;
    font-size: 12px;
  }
  .result .detail-table .user-input {
    color: #d29922;
    font-family: 'Consolas', monospace;
    font-size: 12px;
  }

  .btn-row {
    display: flex;
    gap: 10px;
    justify-content: center;
    margin-top: 24px;
  }
  .btn-row button {
    padding: 10px 28px;
    border-radius: 8px;
    border: none;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  .btn-retry   { background: linear-gradient(135deg, #1f6feb, #58a6ff); color: #fff; }
  .btn-new     { background: #21262d; color: #c9d1d9; border: 1px solid #30363d; }

  .hidden { display: none !important; }

  /* ── 正确率颜色 ── */
  .clr-green  { color: #3fb950; }
  .clr-red    { color: #f85149; }
  .clr-blue   { color: #58a6ff; }
  .clr-yellow { color: #d29922; }

/* ========== 合并全部词伙 ========== */
function getAllVocab() {
  var list = [];
  // 基础词伙
  for (var i = 0; i < foundationVocab.length; i++) {
    list.push({ zh: foundationVocab[i].zh, en: foundationVocab[i].en, source: '基础必背' });
  }
  // 分类词伙
  for (var c = 0; c < allCategories.length; c++) {
    var cat = allCategories[c];
    for (var v = 0; v < cat.vocab.length; v++) {
      list.push({ zh: cat.vocab[v].zh, en: cat.vocab[v].en, source: cat.name });
    }
  }
  return list;
}

/* ========== Fisher-Yates 洗牌 ========== */
function shuffle(arr) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

/* ========== 判断答案（忽略大小写、规范化空格和标点） ========== */
function normalize(s) {
  return s.toLowerCase()
    .replace(/\s+/g, ' ')
    .replace(/[\/\(\)]/g, ' ')
    .replace(/[.,;:!?'\u2018\u2019\u201c\u201d]/g, '')
    .replace(/\s+/g, ' ')
    .trim();
}
function isCorrect(user, answer) {
  return normalize(user) === normalize(answer);
}

/* ========== 状态 ========== */
var TOTAL = 20;
var questions = [];
var currentIndex = 0;
var score = 0;
var results = []; // { zh, en, user, correct }
var testStartTime = Date.now();

function getQueryParam(name) {
  try { return new URLSearchParams(window.location.search).get(name); } catch (e) { return null; }
}

function sendTestComplete() {
  var pct = Math.round((score / TOTAL) * 100);
  try {
    if (window.parent && window.parent.postMessage) {
      window.parent.postMessage({
        type: 'genericTestComplete',
        moduleType: getQueryParam('module_type') || 'writing_phrase',
        moduleName: getQueryParam('module_name') || '写作词伙',
        student_id: getQueryParam('student_id'),
        testType: 'module_test',
        scorePercent: pct,
        correctCount: score,
        totalCount: TOTAL,
        durationSeconds: Math.max(0, Math.round((Date.now() - testStartTime) / 1000)),
        details: results
      }, '*');
    }
  } catch (e) {}
}

/* ========== 渲染 ========== */
var app = document.getElementById('app');

function renderQuiz() {
  var q = questions[currentIndex];
  var progress = Math.round((currentIndex / TOTAL) * 100);

  app.innerHTML =
    '<div class="header">' +
      '<h1> 写作词伙 · 随机测试</h1>' +
      '<div class="sub">共 ' + TOTAL + ' 题 · 英文拼写测试</div>' +
    '</div>' +
    '<div class="progress-wrap">' +
      '<div class="progress-bar"><div class="progress-fill" style="width:' + progress + '%"></div></div>' +
      '<div class="progress-text">' + currentIndex + ' / ' + TOTAL + '</div>' +
    '</div>' +
    '<div class="card">' +
      '<div class="zh">' + q.zh + '</div>' +
      '<div class="input-row">' +
        '<input id="answerInput" type="text" placeholder="输入英文..." autocomplete="off">' +
        '<button id="submitBtn" class="btn">确认</button>' +
      '</div>' +
      '<div class="feedback" id="feedback"></div>' +
    '</div>';

  var input = document.getElementById('answerInput');
  var btn = document.getElementById('submitBtn');
  var fb = document.getElementById('feedback');

  input.focus();

  function check() {
    var val = input.value;
    if (!val.trim()) return;

    var correct = isCorrect(val, q.en);

    btn.disabled = true;
    input.disabled = true;

    if (correct) {
      score++;
      input.className = 'correct';
      fb.className = 'feedback correct-msg';
      fb.innerHTML = ' 正确！';
    } else {
      input.className = 'wrong';
      fb.className = 'feedback wrong-msg';
      fb.innerHTML = ' 正确答案：<b>' + q.en + '</b>';
    }

    results.push({ zh: q.zh, en: q.en, user: val.trim(), correct: correct });

    // 1s 后自动下一题
    setTimeout(nextQuestion, 1200);
  }

  btn.addEventListener('click', check);
  input.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') check();
  });
}

function nextQuestion() {
  currentIndex++;
  if (currentIndex >= TOTAL) {
    renderResult();
  } else {
    renderQuiz();
  }
}

function renderResult() {
  var pct = Math.round((score / TOTAL) * 100);
  var cls;
  if (pct >= 90) cls = 'great';
  else if (pct >= 70) cls = 'good';
  else if (pct >= 50) cls = 'ok';
  else cls = 'poor';

  var detailRows = '';
  for (var i = 0; i < results.length; i++) {
    var r = results[i];
    var icon = r.correct ? '<span class="hit"></span>' : '<span class="miss"></span>';
    var userShow = r.user || '<span style="color:#6b7280">(未作答)</span>';
    detailRows +=
      '<tr>' +
        '<td>' + (i + 1) + '</td>' +
        '<td>' + icon + '</td>' +
        '<td>' + r.zh + '</td>' +
        '<td class="correct-answer">' + r.en + '</td>' +
        '<td class="user-input">' + userShow + '</td>' +
      '</tr>';
  }

  app.innerHTML =
    '<div class="header">' +
      '<h1> 测试结果</h1>' +
      '<div class="sub">20 题 · ' + score + ' 题正确 · 正确率 ' + pct + '%</div>' +
    '</div>' +
    '<div class="result">' +
      '<div class="score-circle ' + cls + '">' +
        '<div class="score-num" style="color:' + (pct >= 90 ? '#3fb950' : pct >= 70 ? '#58a6ff' : pct >= 50 ? '#d29922' : '#f85149') + '">' + pct + '%</div>' +
        '<div class="score-label">正确率</div>' +
      '</div>' +
      '<div class="stats">' +
        '<div class="stat"><b class="clr-green">' + score + '</b><span>正确</span></div>' +
        '<div class="stat"><b class="clr-red">' + (TOTAL - score) + '</b><span>错误</span></div>' +
      '</div>' +
      '<table class="detail-table">' +
        '<thead><tr><th>#</th><th></th><th>中文</th><th>正确答案</th><th>你的输入</th></tr></thead>' +
        '<tbody>' + detailRows + '</tbody>' +
      '</table>' +
      '<div class="btn-row">' +
        '<button class="btn-retry" onclick="startTest()"> 换一批</button>' +
      '</div>' +
    '</div>';
  sendTestComplete();
}

function startTest() {
  var all = getAllVocab();
  questions = shuffle(all).slice(0, TOTAL);
  currentIndex = 0;
  score = 0;
  results = [];
  testStartTime = Date.now();
  renderQuiz();
}

startTest();
