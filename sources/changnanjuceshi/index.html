<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>长难句骨架测试</title><style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --red: #e53935;
  --green: #2e7d32;
  --blue: #1565c0;
  --purple: #6a1b9a;
  --bg: #f5f0e8;
  --card: #fffdf7;
  --shadow: 0 4px 20px rgba(0,0,0,0.10);
  --radius: 14px;
}
body {
  font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
  background: var(--bg);
  color: #2c2c2c;
  min-height: 100vh;
  padding: 20px;
}

/* 开始页面 */
.start-page { max-width: 600px; margin: 60px auto; text-align: center; }
.start-page h1 {
  font-size: 2em;
  background: linear-gradient(135deg, #1a237e, #6a1b9a);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  margin-bottom: 20px;
}
.start-page p { color: #666; margin-bottom: 30px; line-height: 1.8; }
.start-btn {
  padding: 14px 40px;
  background: linear-gradient(135deg, #1a237e, #6a1b9a);
  color: #fff;
  border: none;
  border-radius: 10px;
  font-size: 1.1em;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.2s, opacity 0.2s;
}
.start-btn:hover { opacity: 0.9; transform: scale(1.02); }
.start-btn:active { transform: scale(0.98); }

/* 测试页面 */
.test-page { display: none; max-width: 800px; margin: 0 auto; }
.test-page.active { display: block; }

.progress-info {
  text-align: center;
  margin-bottom: 20px;
  color: #666;
  font-size: 0.95em;
}
.progress-info strong { color: var(--blue); }

.sentence-card {
  background: var(--card);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 24px;
  margin-bottom: 24px;
}
.sentence-header {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 16px;
}
.sentence-num {
  background: var(--blue);
  color: #fff;
  padding: 4px 12px;
  border-radius: 20px;
  font-size: 0.85em;
  font-weight: 700;
}
.sentence-pattern {
  color: #1a237e;
  font-weight: 600;
  font-size: 0.95em;
}
.sentence-original {
  background: #fff8f0;
  border: 2px solid #ffccbc;
  border-radius: 10px;
  padding: 16px;
  font-family: 'Georgia', serif;
  font-size: 1.05em;
  line-height: 1.8;
  margin-bottom: 20px;
}

.blank-item {
  border: 2px solid #e0e0e0;
  border-radius: 10px;
  padding: 14px 16px;
  margin-bottom: 12px;
  transition: border-color 0.3s;
}
.blank-item.correct { border-color: var(--green); background: #f1f8e9; }
.blank-item.wrong { border-color: var(--red); background: #fff5f5; }
.blank-label {
  font-size: 0.82em;
  color: #777;
  margin-bottom: 8px;
}
.blank-input {
  width: 100%;
  padding: 10px 14px;
  border: 2px solid #bdbdbd;
  border-radius: 8px;
  font-size: 1em;
  outline: none;
  transition: border-color 0.2s;
  font-family: inherit;
}
.blank-input:focus { border-color: #5c6bc0; }
.blank-input.correct-input { border-color: var(--green); background: #e8f5e9; }
.blank-input.wrong-input { border-color: var(--red); background: #fff5f5; }
.blank-answer {
  display: none;
  margin-top: 10px;
  padding: 10px 14px;
  background: #e8f5e9;
  border-radius: 8px;
  color: var(--green);
  font-weight: 600;
}
.blank-answer.show { display: block; }
.check-btn {
  margin-top: 10px;
  padding: 8px 20px;
  background: var(--blue);
  color: #fff;
  border: none;
  border-radius: 8px;
  font-size: 0.9em;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.2s;
}
.check-btn:hover { background: #0d47a1; }
.check-btn:disabled { background: #aaa; cursor: default; }
.check-sentence-btn {
  width: 100%;
  padding: 12px 20px;
  font-size: 1em;
  margin-top: 16px;
}

.nav-btns {
  display: flex;
  justify-content: center;
  gap: 16px;
  margin-top: 30px;
}
.nav-btn {
  padding: 12px 30px;
  border-radius: 10px;
  font-size: 1em;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.2s, opacity 0.2s;
}
.nav-btn:hover { opacity: 0.9; transform: scale(1.02); }
.nav-btn:active { transform: scale(0.98); }
.nav-btn.primary {
  background: linear-gradient(135deg, #1a237e, #6a1b9a);
  color: #fff;
  border: none;
}
.nav-btn.secondary {
  background: #f5f5f5;
  color: #666;
  border: 1px solid #ddd;
}

/* 结果页面 */
.result-page { display: none; max-width: 600px; margin: 40px auto; text-align: center; }
.result-page.active { display: block; }

.result-card {
  background: var(--card);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 40px;
}
.result-score {
  font-size: 4em;
  font-weight: 800;
  background: linear-gradient(135deg, #1a237e, #6a1b9a);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  margin: 20px 0;
}
.result-detail {
  color: #666;
  font-size: 1.1em;
  margin-bottom: 30px;
}
.retry-btn {
  padding: 14px 40px;
  background: linear-gradient(135deg, #1a237e, #6a1b9a);
  color: #fff;
  border: none;
  border-radius: 10px;
  font-size: 1.1em;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.2s, opacity 0.2s;
}
.retry-btn:hover { opacity: 0.9; transform: scale(1.02); }

.detail-section {
  margin-top: 30px;
  text-align: left;
}
.detail-section h3 {
  font-size: 1.1em;
  color: #1a237e;
  margin-bottom: 16px;
  padding-bottom: 8px;
  border-bottom: 2px solid #e0e0e0;
}
.detail-item {
  background: #f9f9f9;
  border-radius: 10px;
  padding: 16px;
  margin-bottom: 12px;
}
.detail-item-num {
  font-weight: 700;
  color: var(--blue);
  margin-bottom: 8px;
}
.detail-original {
  font-family: 'Georgia', serif;
  font-size: 0.95em;
  color: #555;
  margin-bottom: 10px;
  line-height: 1.6;
}
.detail-blanks { padding-left: 10px; }
.detail-blank {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  margin-bottom: 6px;
  font-size: 0.92em;
}
.detail-blank-icon { flex-shrink: 0; }
.detail-blank-correct { color: var(--green); }
.detail-blank-wrong { color: var(--red); }
.detail-answer {
  color: #666;
  font-size: 0.88em;
}
</style></head><body><!-- 开始页面 --><div class="start-page" id="startPage"><h1>长难句骨架测试</h1><p>
    本测试从60句长难句中随机抽取5句。<br>
    每句设有若干空格，请填写主句骨架的关键词。<br>
    每句只有一次「检查」，填完后点检查即可看对错。
  </p><button class="start-btn" onclick="startTest()">开始测试</button></div><!-- 测试页面 --><div class="test-page" id="testPage"><div class="progress-info">
    句子 <strong id="currentNum">1</strong> / <strong id="totalNum">5</strong></div><div class="sentence-card" id="sentenceCard"><div class="sentence-header"><span class="sentence-num" id="sentenceNum">第1句</span><span class="sentence-pattern" id="sentencePattern"></span></div><div class="sentence-original" id="sentenceOriginal"></div><div id="blanksContainer"></div><button type="button" class="check-btn check-sentence-btn" id="checkSentenceBtn" onclick="checkSentence()">检查</button></div><div class="nav-btns"><button class="nav-btn secondary" id="prevBtn" onclick="prevSentence()" disabled>上一题</button><button class="nav-btn primary" id="nextBtn" onclick="nextSentence()">下一题</button><button class="nav-btn primary" id="submitBtn" onclick="submitTest()" style="display:none;">查看结果</button></div></div><!-- 结果页面 --><div class="result-page" id="resultPage"><div class="result-card"><h2>测试完成！</h2><div class="result-score" id="resultScore">0%</div><div class="result-detail" id="resultDetail"></div><div class="detail-section" id="detailSection"></div><button class="retry-btn" onclick="retryTest()">重新测试</button></div></div><script>
const SENTENCES = [
  {"num":1,"pattern":"主谓宾倒置与介词短语分隔模式","original":"A really hard curse that would definitely kill an ordinary wizard was put on the Defense Against the Dark Arts teacher position after that.","challenge1":{"boxes":[{"title":"a · 主语","answer":"A really hard curse（一个非常恶毒的诅咒）"},{"title":"b · 谓语","answer":"was put（被施加）"},{"title":"c · 宾语","answer":"on the Defense Against the Dark Arts teacher position（黑魔法防御术教师职位上）"}]}},
  {"num":2,"pattern":"介词短语做状语后置模式","original":"The scientists who study ocean currents claim that the cold water near the North Pole flows constantly toward the equator.","challenge1":{"boxes":[{"title":"a · 主语","answer":"The scientists（科学家们）"},{"title":"b · 谓语","answer":"claim（声称）"},{"title":"c · 宾语","answer":"that the cold water...（冷水...这件事）"}]}},
  {"num":3,"pattern":"双宾语与定语从句嵌套模式","original":"The researchers who study communication among dolphins have given several examples that suggest they have a language of their own.","challenge1":{"boxes":[{"title":"a · 主语","answer":"The researchers（研究者们）"},{"title":"b · 谓语","answer":"have given（给出了）"},{"title":"c1 · 间接宾语","answer":"several examples（几个例子）"},{"title":"c2 · 直接宾语","answer":"that...（关于海豚有自己语言的建议）"}]}},
  {"num":4,"pattern":"形式主语与不定式短语模式","original":"To find a man who can communicate with animals was considered impossible in the old days.","challenge1":{"boxes":[{"title":"a · 形式主语","answer":"To find a man（找到一个能跟动物交流的人）"},{"title":"b · 系动词","answer":"was considered（被认为是）"},{"title":"c · 表语","answer":"impossible（不可能的）"}]}},
  {"num":5,"pattern":"并列复合句与时间状语前置模式","original":"Before people learned how to use computers, they used simple tools to process information, and they relied on mental abilities for most daily tasks.","challenge1":{"boxes":[{"title":"a1 · 前句主语","answer":"they（他们）"},{"title":"b1 · 前句谓语","answer":"used（使用）"},{"title":"c1 · 前句宾语","answer":"simple tools（简单工具）"},{"title":"a2 · 后句主语","answer":"they（他们）"},{"title":"b2 · 后句谓语","answer":"relied on（依靠）"},{"title":"c2 · 后句宾语","answer":"mental abilities（思维能力）"}]}},
  {"num":6,"pattern":"介词短语做定语后置模式","original":"The expansion of universities and the increase in the number of students led to a growing need for financial support.","challenge1":{"boxes":[{"title":"a · 主语","answer":"The expansion of universities and the increase in the number of students（大学的扩张和学生数量的增加）"},{"title":"b · 谓语","answer":"led to（导致）"},{"title":"c · 宾语","answer":"a growing need for financial support（日益增长的财务支持需求）"}]}},
  {"num":7,"pattern":"主语从句与表语从句嵌套模式","original":"What the public should know about pesticides is that they are designed to kill living organisms.","challenge1":{"boxes":[{"title":"a · 主语从句","answer":"What the public should know about pesticides（公众应该了解的关于杀虫剂的事）"},{"title":"b · 系动词","answer":"is（是）"},{"title":"c · 表语从句","answer":"that they are designed to kill living organisms（它们是为了杀死活体生物而设计的）"}]}},
  {"num":8,"pattern":"There be句型与定语从句嵌套模式","original":"There are many problems in the world where nuclear weapons have been developed but never used in wars.","challenge1":{"boxes":[{"title":"a · 谓语","answer":"There are（存在着）"},{"title":"b · 主语","answer":"many problems（许多问题）"},{"title":"c · 定语从句","answer":"where nuclear weapons have been developed but never used in wars（核武器被研发但从未在战争中使用过）"}]}},
  {"num":9,"pattern":"动名词短语做主语模式","original":"Teaching young children to read has become more easier with the use of computers in classrooms.","challenge1":{"boxes":[{"title":"a · 主语","answer":"Teaching young children to read（教小孩子阅读）"},{"title":"b · 系动词","answer":"has become（已经成为）"},{"title":"c · 表语","answer":"more easier（更容易的）"}]}},
  {"num":10,"pattern":"宾语补足语与被动语态模式","original":"The ancient stadium, which once was thought to have been destroyed completely, has been restored to its former glory.","challenge1":{"boxes":[{"title":"a · 主语","answer":"The ancient stadium（古老的体育场）"},{"title":"b · 谓语","answer":"has been restored（已经被修复）"},{"title":"c · 宾语补足语（状语）","answer":"to its former glory（恢复其昔日的辉煌）"}]}},
  {"num":11,"pattern":"形式宾语与不定式短语模式","original":"Scientists consider it a challenging task to predict exactly when an earthquake will occur.","challenge1":{"boxes":[{"title":"a · 主语","answer":"Scientists（科学家们）"},{"title":"b · 谓语","answer":"consider（认为）"},{"title":"c1 · 形式宾语","answer":"it（它）"},{"title":"c2 · 真正宾语","answer":"to predict exactly when an earthquake will occur（准确预测地震何时发生）"}]}},
  {"num":12,"pattern":"定语从句与同位语隔离模式","original":"The theory, which has been widely accepted, that the brain needs stimulation to develop normally, is now being challenged by new research.","challenge1":{"boxes":[{"title":"a · 主语","answer":"The theory（这个理论）"},{"title":"b · 系动词","answer":"is（正在）"},{"title":"c · 表语","answer":"being challenged by new research（被新研究挑战）"}]}},
  {"num":13,"pattern":"祈使句与条件状语从句模式","original":"Take this medicine twice a day, and you will recover from your illness within a week.","challenge1":{"boxes":[{"title":"a · 条件句主语（省略）","answer":"（你）"},{"title":"b1 · 条件句谓语","answer":"Take（服用）"},{"title":"c1 · 条件句宾语","answer":"this medicine（这种药）"},{"title":"b2 · 结果句谓语","answer":"will recover（将会康复）"}]}},
  {"num":14,"pattern":"现在分词短语做状语模式","original":"Having finished the experiment, the scientist submitted the results to the academic journal for publication.","challenge1":{"boxes":[{"title":"a · 主语","answer":"the scientist（这位科学家）"},{"title":"b · 谓语","answer":"submitted（提交了）"},{"title":"c · 宾语","answer":"the results（结果）"}]}},
  {"num":15,"pattern":"过去分词短语做后置定语模式","original":"The student selected for the scholarship had maintained an excellent academic record throughout college.","challenge1":{"boxes":[{"title":"a · 主语","answer":"The student（这个学生）"},{"title":"b · 谓语","answer":"had maintained（保持了）"},{"title":"c · 宾语","answer":"an excellent academic record（优秀的学业记录）"}]}},
  {"num":16,"pattern":"宾语从句与宾语补足语模式","original":"Most people consider flying in an airplane to be much safer than driving a car on the highway.","challenge1":{"boxes":[{"title":"a · 主语","answer":"Most people（大多数人）"},{"title":"b · 谓语","answer":"consider（认为）"},{"title":"c1 · 宾语","answer":"flying in an airplane（乘坐飞机）"},{"title":"c2 · 宾语补足语","answer":"to be much safer（要安全得多）"}]}},
  {"num":17,"pattern":"强调句型模式","original":"It was only after the civilization had developed agriculture that humans began to settle in permanent villages.","challenge1":{"boxes":[{"title":"a · 强调主语","answer":"It（它）"},{"title":"b · 系动词","answer":"was（是）"},{"title":"c · 被强调部分","answer":"only after the civilization had developed agriculture（直到文明发展到农业阶段之后）"}]}},
  {"num":18,"pattern":"插入语与同位语从句模式","original":"The proposal, which the committee finally approved, that the museum should remain open on weekends, was welcomed by the public.","challenge1":{"boxes":[{"title":"a · 主语","answer":"The proposal（这个提议）"},{"title":"b · 谓语","answer":"was welcomed（受到欢迎）"},{"title":"c · 主语补足语（by短语）","answer":"by the public（被公众）"}]}},
  {"num":19,"pattern":"虚拟语气与倒装模式","original":"Had the government not intervened, the endangered species would have become extinct.","challenge1":{"boxes":[{"title":"a · 条件句主语（省略）","answer":"the government（政府）"},{"title":"b · 条件句谓语","answer":"Had not intervened（如果没有干预）"},{"title":"c · 主句谓语","answer":"would have become extinct（可能已经灭绝）"}]}},
  {"num":20,"pattern":"不定式短语做补语与复合宾语模式","original":"The detective found the missing documents hidden in a secret compartment behind the bookshelf.","challenge1":{"boxes":[{"title":"a · 主语","answer":"The detective（侦探）"},{"title":"b · 谓语","answer":"found（发现了）"},{"title":"c1 · 宾语","answer":"the missing documents（失踪的文件）"},{"title":"c2 · 宾语补足语","answer":"hidden in a secret compartment（藏在秘密隔间里）"}]}},
  {"num":21,"pattern":"现在完成时与被动语态模式","original":"Since the beginning of this century, several major scientific discoveries have been made that changed our understanding of the universe.","challenge1":{"boxes":[{"title":"a · 主语","answer":"several major scientific discoveries（几项重大科学发现）"},{"title":"b · 谓语","answer":"have been made（已经被做出）"},{"title":"c · 定语从句","answer":"that changed our understanding of the universe（改变了我们对宇宙的理解）"}]}},
  {"num":22,"pattern":"让步状语从句与介词短语模式","original":"Although he was exhausted from the long journey, the explorer continued his expedition into the jungle.","challenge1":{"boxes":[{"title":"a · 让步从句主语","answer":"he（他）"},{"title":"b · 从句谓语","answer":"was exhausted（筋疲力尽）"},{"title":"c · 主句主语","answer":"the explorer（探险家）"},{"title":"d · 主句谓语","answer":"continued（继续）"}]}},
  {"num":23,"pattern":"独立主格结构模式","original":"The weather having changed suddenly, the outdoor concert had to be moved to an indoor venue.","challenge1":{"boxes":[{"title":"a · 独立主格主语","answer":"The weather（天气）"},{"title":"b · 独立主格谓语","answer":"having changed（突然变化）"},{"title":"c · 主句主语","answer":"the outdoor concert（户外音乐会）"},{"title":"d · 主句谓语","answer":"had to be moved（不得不被转移）"}]}},
  {"num":24,"pattern":"主谓分隔与同位语后置模式","original":"The claim made by the famous scientist that human activities are causing global warming has been supported by extensive research.","challenge1":{"boxes":[{"title":"a · 主语","answer":"The claim（这个声明）"},{"title":"b · 谓语","answer":"has been supported（已经被支持）"},{"title":"c · 主语补足语","answer":"by extensive research（被大量研究）"}]}},
  {"num":25,"pattern":"原因状语从句前置模式","original":"Because the river had flooded the surrounding fields, the farmers had to relocate their entire harvest.","challenge1":{"boxes":[{"title":"a · 原因从句主语","answer":"the river（河流）"},{"title":"b · 从句谓语","answer":"had flooded（已经淹没了）"},{"title":"c · 主句主语","answer":"the farmers（农民们）"},{"title":"d · 主句谓语","answer":"had to relocate（不得不转移）"}]}},
  {"num":26,"pattern":"宾语从句前置与间接引语模式","original":"What the witness saw on that fateful night still haunts her memories despite the passage of many years.","challenge1":{"boxes":[{"title":"a · 主语从句","answer":"What the witness saw on that fateful night（证人在那个命运之夜所看到的）"},{"title":"b · 谓语","answer":"still haunts（仍然困扰）"},{"title":"c · 宾语","answer":"her memories（她的记忆）"}]}},
  {"num":27,"pattern":"方式状语从句与比较结构模式","original":"The population of endangered animals is decreasing faster than scientists predicted in their earlier studies.","challenge1":{"boxes":[{"title":"a · 主语","answer":"The population of endangered animals（濒危动物的数量）"},{"title":"b · 谓语","answer":"is decreasing（正在减少）"},{"title":"c · 比较状语","answer":"than scientists predicted（比科学家们预测的更快）"}]}},
  {"num":28,"pattern":"反身代词与强调结构模式","original":"The ancient Egyptians themselves built the pyramids without any external help from other civilizations.","challenge1":{"boxes":[{"title":"a · 主语","answer":"The ancient Egyptians（古埃及人）"},{"title":"b · 谓语","answer":"built（建造）"},{"title":"c · 宾语","answer":"the pyramids（金字塔）"}]}},
  {"num":29,"pattern":"目的状语从句与结果状语从句模式","original":"The company invested heavily in new technology so that it could improve productivity, and consequently increased its profits.","challenge1":{"boxes":[{"title":"a · 主语","answer":"The company（公司）"},{"title":"b · 谓语","answer":"invested（投资）"},{"title":"c1 · 目的状语","answer":"so that it could improve productivity（以便提高生产力）"},{"title":"c2 · 结果状语","answer":"consequently increased its profits（因此增加了利润）"}]}},
  {"num":30,"pattern":"分裂句与It is...that结构模式","original":"It is not the beauty of a building you should be looking at, but the strength of its foundation.","challenge1":{"boxes":[{"title":"a · 形式主语","answer":"It（它）"},{"title":"b · 系动词","answer":"is（是）"},{"title":"c · 表语","answer":"not the beauty...but the strength（不是美丽...而是坚固）"}]}},
  {"num":31,"pattern":"并列定语从句模式","original":"The professor who taught the course was admired by students, who appreciated her unique teaching methods.","challenge1":{"boxes":[{"title":"a · 主语","answer":"The professor（教授）"},{"title":"b · 谓语","answer":"was admired（受到钦佩）"},{"title":"c1 · 第一定语从句","answer":"who taught the course（教这门课的）"},{"title":"c2 · 第二定语从句","answer":"who appreciated her unique teaching methods（欣赏她独特教学方法的）"}]}},
  {"num":32,"pattern":"状语后置与介词短语模式","original":"The teacher explained the concept to the students in a way that everyone could understand clearly.","challenge1":{"boxes":[{"title":"a · 主语","answer":"The teacher（老师）"},{"title":"b · 谓语","answer":"explained（解释）"},{"title":"c1 · 宾语","answer":"the concept（这个概念）"},{"title":"c2 · 介词短语（方式状语）","answer":"in a way that everyone could understand（以一种每个人都能理解的方式）"}]}},

let testSentences = [];
let currentIndex = 0;
let userAnswers = [];
let submitted = [];
let testStartTime = Date.now();
let testReportSent = false;

function getQueryParam(name) {
  try { return new URLSearchParams(window.location.search).get(name); } catch (e) { return null; }
}

function sendTestComplete(scorePercent, correctCount, totalCount) {
  if (testReportSent) return;
  testReportSent = true;
  try {
    if (window.parent && window.parent.postMessage) {
      window.parent.postMessage({
        type: 'genericTestComplete',
        moduleType: getQueryParam('module_type') || 'sentence',
        moduleName: getQueryParam('module_name') || '长难句分析',
        student_id: getQueryParam('student_id'),
        testType: getQueryParam('wrongbook') === '1' ? 'wrong_words' : 'module_test',
        scorePercent: scorePercent,
        correctCount: correctCount,
        totalCount: totalCount,
        durationSeconds: Math.max(0, Math.round((Date.now() - testStartTime) / 1000)),
        completed: true,
        details: testSentences.map(function(s, sIdx) {
          var boxes = s.challenge1.boxes;
          var allOk = true;
          for (var b = 0; b < boxes.length; b++) {
            if (!isBlankCorrect(userAnswers[sIdx].answers[b], boxes[b].answer)) allOk = false;
          }
          return {
            item_key: String(s.num),
            num: s.num,
            title: s.original,
            original: s.original,
            pattern: s.pattern,
            is_correct: allOk
          };
        })
      }, '*');
    }
  } catch (e) {}
}

function startTest() {
  if (getQueryParam('wrongbook') === '1' || getQueryParam('mode') === 'wrongbook') {
    var mt = getQueryParam('module_type') || 'sentence';
    fetch('/api/student/wrong-items?module_type=' + encodeURIComponent(mt) + '&unmastered=1', { credentials: 'include' })
      .then(function(r) { return r.json(); })
      .then(function(j) {
        var keys = {};
        ((j && j.data) || []).forEach(function(it) { keys[String(it.item_key)] = true; });
        var picked = SENTENCES.filter(function(s) { return keys[String(s.num)]; })
          .sort(function() { return Math.random() - 0.5; })
          .slice(0, 5);
        if (!picked.length) {
          alert('暂无错题');
          return;
        }
        beginSentenceTest(picked);
      })
      .catch(function() { alert('加载错题失败'); });
    return;
  }
  beginSentenceTest([...SENTENCES].sort(function() { return Math.random() - 0.5; }).slice(0, 5));
}

function beginSentenceTest(list) {
  document.getElementById('startPage').style.display = 'none';
  document.getElementById('testPage').classList.add('active');
  testSentences = list;
  userAnswers = testSentences.map(function(s) { return { answers: s.challenge1.boxes.map(function() { return ''; }), checked: [] }; });
  submitted = testSentences.map(function() { return false; });
  currentIndex = 0;
  testStartTime = Date.now();
  testReportSent = false;
  renderSentence();
}

function isBlankCorrect(userAnswer, correctAnswer) {
  const ua = String(userAnswer || '').trim().toLowerCase();
  const ca = String(correctAnswer || '').toLowerCase();
  if (!ua) return false;
  const correctKeywords = ca.split(/[（），,()]/).filter(k => k.length > 1);
  for (const keyword of correctKeywords) {
    const kw = keyword.trim();
    if (ua.includes(kw) || (kw.includes(ua) && ua.length >= kw.length * 0.5)) return true;
  }
  return false;
}

function renderSentence() {
  const s = testSentences[currentIndex];
  const boxes = s.challenge1.boxes;
  document.getElementById('currentNum').textContent = currentIndex + 1;
  document.getElementById('totalNum').textContent = testSentences.length;
  document.getElementById('sentenceNum').textContent = '第' + (currentIndex + 1) + '句';
  document.getElementById('sentencePattern').textContent = s.pattern;
  document.getElementById('sentenceOriginal').textContent = s.original;
  const container = document.getElementById('blanksContainer');
  container.innerHTML = '';
  boxes.forEach((box, i) => {
    const div = document.createElement('div');
    div.className = 'blank-item';
    div.id = 'blankItem' + i;
    const label = document.createElement('div');
    label.className = 'blank-label';
    label.textContent = box.title;
    const input = document.createElement('input');
    input.type = 'text';
    input.className = 'blank-input';
    input.id = 'blankInput' + i;
    input.placeholder = '填写答案...';
    input.value = userAnswers[currentIndex].answers[i];
    input.addEventListener('input', (e) => {
      userAnswers[currentIndex].answers[i] = e.target.value;
    });
    const answerDiv = document.createElement('div');
    answerDiv.className = 'blank-answer';
    answerDiv.id = 'blankAnswer' + i;
    div.appendChild(label);
    div.appendChild(input);
    div.appendChild(answerDiv);
    container.appendChild(div);
  });
  document.getElementById('prevBtn').disabled = currentIndex === 0;
  if (currentIndex === testSentences.length - 1) {
    document.getElementById('nextBtn').style.display = 'none';
    document.getElementById('submitBtn').style.display = 'inline-block';
  } else {
    document.getElementById('nextBtn').style.display = 'inline-block';
    document.getElementById('submitBtn').style.display = 'none';
  }
  const checkBtn = document.getElementById('checkSentenceBtn');
  if (checkBtn) checkBtn.style.display = submitted[currentIndex] ? 'none' : 'block';
  if (submitted[currentIndex]) {
    showAnswersForSentence(currentIndex);
  }
}

function checkSentence() {
  if (submitted[currentIndex]) return;
  submitted[currentIndex] = true;
  showAnswersForSentence(currentIndex);
  const checkBtn = document.getElementById('checkSentenceBtn');
  if (checkBtn) checkBtn.style.display = 'none';
}

function showAnswersForSentence(idx) {
  const s = testSentences[idx];
  const boxes = s.challenge1.boxes;
  boxes.forEach((box, i) => {
    const input = document.getElementById('blankInput' + i);
    const blankItem = document.getElementById('blankItem' + i);
    const answerDiv = document.getElementById('blankAnswer' + i);
    const isCorrect = isBlankCorrect(userAnswers[idx].answers[i], box.answer);
    userAnswers[idx].checked[i] = isCorrect;
    if (input) {
      input.disabled = true;
      if (isCorrect) {
        input.classList.add('correct-input');
        input.classList.remove('wrong-input');
        blankItem.classList.add('correct');
        blankItem.classList.remove('wrong');
      } else {
        input.classList.add('wrong-input');
        input.classList.remove('correct-input');
        blankItem.classList.add('wrong');
        blankItem.classList.remove('correct');
      }
    }
    if (answerDiv) {
      answerDiv.textContent = '正确答案：' + box.answer;
      answerDiv.classList.add('show');
    }
  });
}

function prevSentence() {
  if (currentIndex > 0) {
    currentIndex--;
    renderSentence();
  }
}

function nextSentence() {
  if (currentIndex < testSentences.length - 1) {
    currentIndex++;
    renderSentence();
  }
}

function submitTest() {
  if (testReportSent) return;
  for (let i = 0; i < testSentences.length; i++) {
    submitted[i] = true;
  }
  let totalBlanks = 0;
  let correctBlanks = 0;
  testSentences.forEach((s, sIdx) => {
    const boxes = s.challenge1.boxes;
    boxes.forEach((box, bIdx) => {
      totalBlanks++;
      const userAnswer = userAnswers[sIdx].answers[bIdx].trim().toLowerCase();
      const correctAnswer = box.answer.toLowerCase();
      const correctKeywords = correctAnswer.split(/[（），,()]/).filter(k => k.length > 1);
      if (!userAnswer || userAnswer.length === 0) {
        // 空答案，不增加correctBlanks
      } else {
        for (const keyword of correctKeywords) {
          const kw = keyword.trim();
          if (userAnswer.includes(kw) || (kw.includes(userAnswer) && userAnswer.length >= kw.length * 0.5)) {
            correctBlanks++;
            break;
          }
        }
      }
    });
  });
  const percentage = Math.round((correctBlanks / totalBlanks) * 100);
  sendTestComplete(percentage, correctBlanks, totalBlanks);
  document.getElementById('testPage').classList.remove('active');
  document.getElementById('resultPage').classList.add('active');
  document.getElementById('resultScore').textContent = percentage + '%';
  document.getElementById('resultDetail').textContent = '共 ' + totalBlanks + ' 个空，你答对了 ' + correctBlanks + ' 个';
  const detailSection = document.getElementById('detailSection');
  detailSection.innerHTML = '<h3>详细结果</h3>';
  testSentences.forEach((s, sIdx) => {
    const boxes = s.challenge1.boxes;
    const sentenceDiv = document.createElement('div');
    sentenceDiv.className = 'detail-item';
    let sentenceHTML = '<div class="detail-item-num">第' + (sIdx + 1) + '句 - ' + s.pattern + '</div>';
    sentenceHTML += '<div class="detail-original">' + s.original + '</div>';
    sentenceHTML += '<div class="detail-blanks">';
    boxes.forEach((box, bIdx) => {
      const userAnswer = userAnswers[sIdx].answers[bIdx].trim().toLowerCase();
      const correctAnswer = box.answer.toLowerCase();
      const correctKeywords = correctAnswer.split(/[（），,()]/).filter(k => k.length > 1);
      let isCorrect = false;
      if (!userAnswer || userAnswer.length === 0) {
        isCorrect = false;
      } else {
        for (const keyword of correctKeywords) {
          const kw = keyword.trim();
          if (userAnswer.includes(kw) || (kw.includes(userAnswer) && userAnswer.length >= kw.length * 0.5)) {
            isCorrect = true;
            break;
          }
        }
      }
      const icon = isCorrect ? '' : '';
      const className = isCorrect ? 'detail-blank-correct' : 'detail-blank-wrong';
      sentenceHTML += '<div class="detail-blank ' + className + '">';
      sentenceHTML += '<span class="detail-blank-icon">' + icon + '</span>';
      sentenceHTML += '<span>' + box.title + '：你的答案「' + userAnswers[sIdx].answers[bIdx] + '」</span>';
      sentenceHTML += '</div>';
      sentenceHTML += '<div class="detail-answer">正确答案：' + box.answer + '</div>';
    });
    sentenceHTML += '</div>';
    sentenceDiv.innerHTML = sentenceHTML;
    detailSection.appendChild(sentenceDiv);
  });
  renderSentence();
}

function retryTest() {
  document.getElementById('resultPage').classList.remove('active');
  document.getElementById('startPage').style.display = 'block';
}
</script></body></html>
