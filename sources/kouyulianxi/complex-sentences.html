<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>口语复合句闯关 · 中文造句</title>
<style>
:root{
--bg:#0b0e1f; --card:#151a33; --card2:#1d2444; --line:#2a3258;
--txt:#eef1ff; --muted:#9aa3c7; --gold:#ffd166; --green:#36d399;
--blue:#5b8cff; --pink:#ff6b9d;
--shell:720px; --pad:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%}
body{
margin:0;min-height:100%;color:var(--txt);
font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
line-height:1.65;
background:
radial-gradient(1200px 500px at 50% -80px,rgba(91,140,255,.18),transparent 60%),
radial-gradient(800px 400px at 90% 20%,rgba(255,209,102,.08),transparent 50%),
var(--bg);
padding:20px 16px 48px;
}
#app{max-width:var(--shell);margin:0 auto}
.page-head{margin-bottom:8px}
h1{font-size:28px;margin:0 0 6px;letter-spacing:.2px;font-weight:750}
h2{font-size:20px;margin:0 0 10px;font-weight:700}
.sub{color:var(--muted);font-size:14px;margin:0}
.topbar{display:flex;gap:10px;align-items:stretch;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin:16px 0}
.stat{flex:1;text-align:center;padding:4px 0}
.stat b{display:block;font-size:22px;color:var(--gold);line-height:1.2}
.stat span{font-size:12px;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 20px;margin:14px 0}
.home-grid{display:grid;grid-template-columns:1fr;gap:14px;margin:16px 0}
.home-grid .card{margin:0;display:flex;flex-direction:column;min-height:100%}
.home-grid .card .sub{flex:1}
.home-grid .btn{margin-top:16px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:14px 0 8px}
.pat{background:var(--card2);border:1px solid var(--line);border-radius:16px;padding:16px;cursor:pointer;transition:.18s ease;min-height:118px}
.pat:hover{border-color:rgba(91,140,255,.55);background:#222a4f;transform:translateY(-2px)}
.pat:active{transform:scale(.98)}
.pat .em{font-size:28px;line-height:1}
.pat .nm{font-size:15px;font-weight:700;margin-top:8px}
.pat .sk{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.45}
.btn{display:inline-flex;align-items:center;justify-content:center;width:100%;border:none;border-radius:12px;padding:13px 18px;font-size:15px;font-weight:700;color:#0b0e1f;background:var(--gold);cursor:pointer;margin-top:10px;transition:.15s}
.btn:hover{filter:brightness(1.06)}
.btn:active{opacity:.88}
.btn.blue{background:var(--blue);color:#fff}
.btn.ghost{background:transparent;color:var(--txt);border:1px solid var(--line);width:auto;min-width:140px}
.btn.sm{padding:10px 16px;font-size:14px;display:inline-flex;width:auto;margin:8px 8px 0 0}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px 22px;margin:12px 0}
.qbox{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0 4px}
.part{display:inline-block;background:rgba(91,140,255,.18);color:var(--blue);border:1px solid rgba(91,140,255,.35);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700}
.qtext{color:var(--gold);font-size:14px;font-weight:650;line-height:1.5}
.quiz{font-size:18px;font-weight:700;background:var(--card2);border-radius:14px;padding:16px 18px;margin:12px 0;line-height:1.7}
.skeleton{font-size:17px;line-height:1.7;margin:16px 0;display:flex;flex-direction:column;align-items:stretch;gap:10px}
.slot{display:block;width:100%;min-width:0;margin:0}
.sk-txt{color:var(--muted);font-weight:650}
select{width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card2);color:var(--txt);font-size:15px;cursor:pointer}
select:hover{border-color:rgba(91,140,255,.5)}
select.ok{border-color:var(--green)}
select.no{border-color:#ff6b6b}
.sentence{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:14px 16px;font-size:17px;line-height:1.8;margin:14px 0;display:none}
.feedback{font-size:15px;font-weight:700;margin:10px 0;min-height:22px}
.ok{color:var(--green)} .no{color:#ff6b6b}
.listen{background:var(--blue);color:#fff;border:none;border-radius:10px;padding:11px 16px;font-size:14px;font-weight:700;cursor:pointer;margin-top:6px;transition:.15s}
.listen:hover{filter:brightness(1.08)}
.progress{height:9px;background:var(--card2);border-radius:6px;overflow:hidden;margin:10px 0 14px}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#ffb347);transition:.3s}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:8px}
.center{text-align:center}
.big{font-size:34px;text-align:center;margin:10px 0}
.made{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:14px 16px;font-size:15px;line-height:1.9;margin-top:12px;text-align:left}
.made div{padding:4px 0;border-bottom:1px dashed var(--line)}
.made div:last-child{border-bottom:none}
.toast{position:fixed;left:50%;top:14%;transform:translateX(-50%);background:#000c;border:1px solid var(--line);padding:10px 16px;border-radius:10px;font-size:14px;z-index:99;opacity:0;transition:.3s;pointer-events:none}
.toast.show{opacity:1}
.foot{color:var(--muted);font-size:12px;text-align:center;margin-top:22px}
.btn.red{background:var(--pink);color:#fff}
.btn:disabled{opacity:.4;cursor:not-allowed}
.stars{font-size:28px;line-height:1;user-select:none}
.star{cursor:pointer;margin-right:6px;transition:.1s}
.star:hover{transform:scale(1.12)}
.recbox{margin-top:12px}
.recbox audio{width:100%;max-width:480px;margin-top:6px}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:4px}
.toolbar h2{margin:0}
.sk-txt{white-space:pre-wrap}
.practice-side{margin-top:14px;padding-top:4px}
@media (min-width:900px){
:root{--shell:1080px; --pad:28px}
body{padding:36px 28px 64px}
h1{font-size:34px}
.home-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.pat{min-height:132px;padding:18px}
.pat .nm{font-size:16px}
.panel{padding:26px 28px}
.quiz{font-size:20px;padding:18px 20px}
.skeleton{font-size:18px}
.sentence{font-size:18px}
.btn.ghost{margin-top:16px}
.practice-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:20px;align-items:start}
.practice-side{margin-top:0;background:var(--card2);border:1px solid var(--line);border-radius:16px;padding:18px}
.practice-side .sub{margin-bottom:10px}
}
@media (min-width:1200px){
:root{--shell:1180px}
.grid{grid-template-columns:repeat(4,minmax(0,1fr))}
}

.sec-title{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:22px 0 8px;font-weight:700}
.home-grid.two{grid-template-columns:1fr;gap:12px}
.mode-tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;margin-bottom:8px;font-weight:700}
.mode-tag.assemble{background:rgba(255,209,102,.15);color:var(--gold);border:1px solid rgba(255,209,102,.35)}
.mode-tag.speak{background:rgba(255,107,157,.15);color:var(--pink);border:1px solid rgba(255,107,157,.35)}
.timer-wrap{display:flex;align-items:center;gap:14px;margin:14px 0}
.timer-ring{width:64px;height:64px;border-radius:50%;border:4px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;color:var(--gold);background:var(--card2)}
.timer-ring.warn{border-color:var(--pink);color:var(--pink)}
.timer-hint{color:var(--muted);font-size:13px;line-height:1.5}
.speak-prompt{font-size:22px;font-weight:750;line-height:1.7;background:var(--card2);border:1px solid var(--line);border-radius:16px;padding:22px 20px;margin:12px 0;text-align:center}
.reveal-box{display:none;margin-top:12px}
.reveal-box.show{display:block}
.rate-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.rate-btn{flex:1;min-width:110px;border:1px solid var(--line);background:var(--card2);color:var(--txt);border-radius:12px;padding:12px;font-size:14px;font-weight:700;cursor:pointer}
.rate-btn:hover{border-color:var(--blue)}
.rate-btn.on{border-color:var(--green);background:rgba(54,211,153,.12);color:var(--green)}
@media (min-width:900px){
.home-grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.speak-prompt{font-size:26px;padding:28px 24px}
}


.sent-list{display:flex;flex-direction:column;gap:10px;margin:14px 0}
.sent-item{display:grid;grid-template-columns:28px 36px 1fr auto;gap:10px;align-items:start;background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer;transition:.15s}
.sent-item:hover{border-color:rgba(91,140,255,.55);background:#222a4f}
.sent-item .num{font-weight:800;color:var(--gold);font-size:14px;padding-top:2px}
.sent-item .cn{font-size:15px;font-weight:650;line-height:1.55}
.sent-item .meta{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.4}
.sent-item .st{font-size:12px;font-weight:700;white-space:nowrap;padding-top:2px}
.sent-item .st.ok{color:var(--green)}
.sent-item .st.half{color:var(--gold)}
.sent-item .st.no{color:var(--pink)}
.sent-item .st.todo{color:var(--muted)}
.sent-item input[type=checkbox]{width:18px;height:18px;margin-top:3px;accent-color:var(--blue);cursor:pointer}
.picker-actions{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0 4px}
.picker-actions .btn{width:auto;margin-top:0;min-width:140px}


.stt-box{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:10px;font-size:14px;line-height:1.7;min-height:52px}
.stt-label{font-size:12px;color:var(--muted);margin-bottom:4px}
.word-ok{color:var(--green);font-weight:700}
.word-bad{color:#ff6b6b;font-weight:700;text-decoration:underline}
.word-miss{color:var(--pink);opacity:.85;font-weight:700}
.word-extra{color:#ffb347;font-weight:700}
.compare-pass{color:var(--green);font-weight:800;font-size:16px;margin-top:10px}
.compare-fail{color:#ff6b6b;font-weight:800;font-size:16px;margin-top:10px}

@media (max-width:640px){
h1{font-size:24px}
.card,.panel{padding:16px}
.btn.ghost{width:100%}
}
</style>
</head>

function tokenizeEn(s){
/* 小写；缩合展开；连字符当空格；去掉标点 —— 只做格式归一，不把听错词当对 */
let t=String(s||'')
.toLowerCase()
.replace(/[’‘]/g,"'");
t=t.replace(/\b(it)'?s\b/g,'it is')
.replace(/\b(i)'?m\b/g,'i am')
.replace(/\b(you)'?re\b/g,'you are')
.replace(/\b(we)'?re\b/g,'we are')
.replace(/\b(they)'?re\b/g,'they are')
.replace(/\b(that)'?s\b/g,'that is')
.replace(/\b(there)'?s\b/g,'there is')
.replace(/\b(what)'?s\b/g,'what is')
.replace(/\b(don)'?t\b/g,'do not')
.replace(/\b(doesn)'?t\b/g,'does not')
.replace(/\b(didn)'?t\b/g,'did not')
.replace(/\b(can)'?t\b/g,'can not')
.replace(/\b(won)'?t\b/g,'will not')
.replace(/\b(i)'?ve\b/g,'i have')
.replace(/\b(we)'?ve\b/g,'we have')
.replace(/\b(i)'?ll\b/g,'i will')
.replace(/[\-—–]/g,' ')
.replace(/[.,!?;:'"()\[\]{}…]/g,'')
.replace(/[^\w\s]/g,'')
.replace(/\s+/g,' ')
.trim();
return t?t.split(/\s+/).filter(w=>w.length>0):[];
}
/* 仅当标准句里出现该词时，把 ASR 已知误听改回标准词（修识别，不放宽发音标准） */
const ASR_MISHEAR={
besties:['bies','bees','beasties','bestys','bestis','bessies','bestie','bc','bcs'],
starbucks:['starbuck','starbuks','star bucks'],
enjoyable:['injoyable','enjoyble'],
cheerful:['cheerfull','cheerfal'],
hustle:['hustel','hassle'],
bustle:['bustel'],
takeaways:['takeaway','take aways'],
jogging:['joging','joggingg'],
browsing:['browing'],
};
function repairAsrByReference(spoken, target){
const tWords=new Set(tokenizeEn(target));
let out=String(spoken||'');
const repairs=[];
Object.keys(ASR_MISHEAR).forEach(correct=>{
if(!tWords.has(correct)) return;
ASR_MISHEAR[correct].forEach(wrong=>{
const re=new RegExp('\\b'+wrong.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b','gi');
if(re.test(out)){
out=out.replace(re, correct);
repairs.push(wrong+'→'+correct);
}
});
});
return {text:out, repairs};
}
/* 热词宜少而精：过多权重 11 会互相抢，反而压不住 besties */
function buildHotwordList(sentence){
const HARD=new Set(['besties','starbucks','binge','watching','hustle','bustle','enjoyable','cheerful','chill','takeaways','jogging','browsing','stunning','fascinating']);
const raw=String(sentence||'')
.replace(/[’‘]/g,"'")
.replace(/[\-—–]/g,' ')
.replace(/[.,!?;:"()\[\]{}…]/g,' ');
const words=raw.split(/\s+/).map(w=>w.replace(/^'+|'+$/g,'').toLowerCase()).filter(w=>/^[a-z]{2,30}$/.test(w));
const seen=new Set();
const list=[];
/* 先塞难词超级热词 */
words.forEach(w=>{
if(!HARD.has(w) || seen.has(w)) return;
seen.add(w);
list.push(w+'|11');
});
words.forEach(w=>{
if(seen.has(w) || list.length>=24) return;
seen.add(w);
list.push(w+'|'+(w.length>=7?10:7));
});
['shopping mall','hang out','chill out','digital payments','household chores','hustle and bustle','binge watching','window shopping'].forEach(ph=>{
if(raw.toLowerCase().includes(ph) && list.length<32) list.push(ph+'|11');
});
return list.join(',');
}
/* 编辑距离对齐：仅用于标色；通过条件仍是 edits===0（逐词严格） */
function alignWords(t, s){
const m=t.length, n=s.length;
const dp=Array.from({length:m+1},()=>new Array(n+1).fill(0));
for(let i=0;i<=m;i++) dp[i][0]=i;
for(let j=0;j<=n;j++) dp[0][j]=j;
for(let i=1;i<=m;i++){
for(let j=1;j<=n;j++){
const sub=dp[i-1][j-1]+(t[i-1]===s[j-1]?0:1);
dp[i][j]=Math.min(sub, dp[i-1][j]+1, dp[i][j-1]+1);
}
}
const ops=[];
let i=m, j=n;
while(i>0||j>0){
if(i>0&&j>0&&dp[i][j]===dp[i-1][j-1]+(t[i-1]===s[j-1]?0:1)){
if(t[i-1]===s[j-1]) ops.push({type:'ok', tw:t[i-1], sw:s[j-1]});
else ops.push({type:'bad', tw:t[i-1], sw:s[j-1]});
i--; j--;
}else if(i>0&&dp[i][j]===dp[i-1][j]+1){
ops.push({type:'miss', tw:t[i-1]});
i--;
}else{
ops.push({type:'extra', sw:s[j-1]});

function compareStrict(target, spoken){

}

<button class="btn sm blue" onclick="speakNext()">${(G.queue&&G.queue.indexOf(G.idx)<G.queue.length-1)?'下一句 ▶':'回到句子列表'}</button>
<button class="btn ghost" onclick="backToPicker()" style="margin-top:0">← 全部句子</button>
</div>
</div>`;
}
/* startDrill moved above with picker */

function onSelect(i,val){
G.selected[i]=val;
const p=CD().find(x=>x.id===G.pid);
const s=buildSentence(p,G.selected);
const box=document.getElementById('sentence');
if(s){ box.style.display='block'; box.textContent=s; }
else { box.style.display='none'; }
}
function checkDrill(){
const p=CD().find(x=>x.id===G.pid);
const item=p.items[G.idx];
const s=buildSentence(p,G.selected);
const fb=document.getElementById('fb');
if(!s){ fb.className='feedback no'; fb.textContent='⚠️ 还有空没选满'; return; }
const correct=item.ans.every((a,i)=>G.selected[i]===a);
document.querySelectorAll('.dsel').forEach((sel,i)=>{
sel.classList.remove('ok','no');
sel.classList.add(G.selected[i]===item.ans[i]?'ok':'no');
});
if(correct){
G.combo++; if(G.combo>G.best) G.best=G.combo; G.xp+=10+Math.min(G.combo,5);
G.results.push({pid:G.pid, idx:G.idx, s:s});
fb.className='feedback ok';
fb.textContent='✅ 正确！连击 ×'+G.combo+'  +'+(10+Math.min(G.combo,5))+' XP';
save();
const nb=document.getElementById('nextBtn');
nb.style.display='inline-block';
nb.textContent = G.idx>=p.items.length-1 ? '🎉 看结果' : '下一题 ▶';
playItem(G.pid, G.idx+1);
} else {
G.combo=0;
fb.className='feedback no';
fb.textContent='❌ 有地方不对，对照中文再选一次';
}
}
function nextItem(){
const p=CD().find(x=>x.id===G.pid);
if(G.queue && G.queue.length){
const pos=G.queue.indexOf(G.idx);
if(pos>=0 && pos<G.queue.length-1){
G.idx=G.queue[pos+1]; G.selected=[]; render(); window.scrollTo(0,0); return;
}
toast('本轮拼装完成，回到句子列表');
G.screen='picker'; render(); window.scrollTo(0,0); return;
}
if(G.idx>=p.items.length-1){ return finishDrill(); }
G.idx++; G.selected=[]; render(); window.scrollTo(0,0);
}
function quitDrill(){ backToPicker(); }
function finishDrill(){
const p=CD().find(x=>x.id===G.pid);
const made=G.results.map((r,i)=>`<div>${i+1}. ${r.s}</div>`).join('');
const allRight=G.results.length===p.items.length;
const isAdv=G.kind==='adv';
const app=document.getElementById('app');
const tip = isAdv
? `你用高级词组 <b>${p.name}</b> 造出了 ${G.results.length} 个句子。考试时，用它替换掉 I like / because / now 这类低级表达，语法多样性立刻上去了。挨个 🔊 听 + 跟读，练到脱口而出。`
: `你用这个句型造出了 ${G.results.length} 个句子。下方是成品，挨个 🔊 听 + 跟读，练到脱口而出。`;
app.innerHTML=`
<div class="panel center" style="max-width:820px;margin:12px auto">
<div class="big">${allRight?'🎉':'👍'}</div>
<h2>${p.emoji} ${p.name} · ${allRight?(isAdv?'全部 8 题做对！':'全部 10 题做对！'):'完成'}</h2>
<p class="sub">${tip}</p>
<div class="made">${made||'<div>（本题没做对，回去再练）</div>'}</div>
<div class="actions" style="justify-content:center;margin-top:16px">
<button class="listen" onclick="speakAll()">🔊 一句句听全部</button>
<button class="btn sm" onclick="practiceAllInOrder()" style="margin-top:0;background:var(--gold);color:#0b0e1f">🔁 再按顺序练</button>
<button class="btn ghost" onclick="backToPicker()" style="margin-top:0">← 全部句子</button>
<button class="btn ghost" onclick="go('${isAdv?'advlist':'list'}')" style="margin-top:0">选其他${isAdv?'词组':'句型'} →</button>
</div>
</div>`;
window.scrollTo(0,0);
}
function speakAll(){
const items=G.results;
let i=0;
function next(){
if(i>=items.length) return;
playItem(items[i].pid, items[i].idx+1); i++;
setTimeout(next, 3200);
}
next();
}
/* ============ 启动 ============ */
load();
render();
</script>
</body>
</html>
