<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>录播课管理 - 藕叶英语</title>
  <style>
    :root {
      --brand: #5c6bc0;
      --bg: #f4f5f9;
      --border: #e2e4ec;
      --text: #1a1d2e;
      --muted: #6b7280;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .wrap { max-width: 980px; margin: 0 auto; padding: 20px 16px 48px; }
    h1 { font-size: 1.35rem; margin: 0; }
    .sub { color: var(--muted); font-size: 0.9rem; margin: 6px 0 16px; }
    .msg { background: #fff; border: 1px solid var(--border); border-radius: 12px; padding: 24px; text-align: center; }
    .msg.error { color: #b91c1c; border-color: #fecaca; background: #fef2f2; }
    .hint { background: #eef2ff; border: 1px solid #c7d2fe; border-radius: 12px; padding: 12px 14px; color: #3730a3; font-size: 0.9rem; margin-bottom: 16px; }
    .toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; align-items: center; }
    .toolbar input { max-width: 220px; }
    .subject { background: #fff; border: 1px solid var(--border); border-radius: 14px; padding: 16px; margin-bottom: 14px; }
    .subject-head { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; margin-bottom: 8px; }
    .subject-head .grow { flex: 1; min-width: 180px; }
    .lesson { border: 1px solid var(--border); border-radius: 10px; padding: 12px; margin-bottom: 10px; background: #fafbff; }
    label { display: block; font-size: 0.82rem; color: var(--muted); margin: 8px 0 4px; }
    input, select, textarea {
      width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px;
      font: inherit; background: #fff;
    }
    textarea { min-height: 64px; resize: vertical; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    @media (max-width: 640px) { .row { grid-template-columns: 1fr; } }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
    button {
      border: 0; border-radius: 8px; padding: 8px 14px; font: inherit; cursor: pointer;
    }
    .primary { background: var(--brand); color: #fff; }
    .ghost { background: #fff; border: 1px solid var(--border); }
    .danger { background: #fff; color: #b91c1c; border: 1px solid #fecaca; }
    .save-bar { position: sticky; bottom: 0; background: rgba(244,245,249,.95); padding: 12px 0 0; }
    code { font-size: 0.9em; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>录播课管理</h1>
    <p class="sub">先把视频传到 OSS 的 <code>courses</code> 文件夹，再在这里添加科目、填写课名和明细。</p>
    <div id="status" class="msg">正在检查教师登录…</div>
    <div id="app" hidden>
      <div class="hint">
        科目由老师自己添加（例如听力、阅读、长难句）。保存后学生「录播课」会按这些科目显示。
      </div>
      <div class="toolbar">
        <input id="newSubjectName" type="text" placeholder="新科目名称，例如：长难句">
        <button class="ghost" id="addSubjectBtn" type="button">添加科目</button>
      </div>
      <div id="subjects"></div>
      <div class="save-bar">
        <button class="primary" id="saveBtn" type="button">保存课表</button>
        <span id="saveMsg" class="sub"></span>
      </div>
    </div>
  </div>
  <script src="/luboke/manage.js?v=20260908subj2"></script>
</body>
</html>
