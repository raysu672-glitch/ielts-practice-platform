<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>录播课管理 - 藕叶英语</title>
  <style>
    :root {
      --brand: #5c6bc0;
      --bg: #f4f5f9;
      --border: #e2e4ec;
      --text: #1a1d2e;
      --muted: #6b7280;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .wrap { max-width: 980px; margin: 0 auto; padding: 20px 16px 48px; }
    h1 { font-size: 1.35rem; margin: 0; }
    .sub { color: var(--muted); font-size: 0.9rem; margin: 6px 0 16px; }
    .msg { background: #fff; border: 1px solid var(--border); border-radius: 12px; padding: 24px; text-align: center; }
    .msg.error { color: #b91c1c; border-color: #fecaca; background: #fef2f2; }
    .hint { background: #eef2ff; border: 1px solid #c7d2fe; border-radius: 12px; padding: 12px 14px; color: #3730a3; font-size: 0.9rem; margin-bottom: 16px; }
    .toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; align-items: center; }
    .toolbar input { max-width: 220px; }
    .subject { background: #fff; border: 1px solid var(--border); border-radius: 14px; padding: 16px; margin-bottom: 14px; }
    .subject-head { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; margin-bottom: 8px; }
    .subject-head .grow { flex: 1; min-width: 180px; }
    .collapse-toggle {
      flex: none; width: 36px; height: 36px; padding: 0; background: #fff;
      border: 1px solid var(--border); border-radius: 8px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .collapse-toggle:hover { border-color: var(--brand); }
    .collapse-toggle .chevron {
      width: 9px; height: 9px; border-right: 2px solid var(--muted);
      border-bottom: 2px solid var(--muted); transform: rotate(45deg);
      transition: transform .18s ease; margin-bottom: 3px;
    }
    .subject.collapsed { padding-bottom: 12px; }
    .subject.collapsed .collapse-toggle .chevron { transform: rotate(-45deg); margin-bottom: 0; margin-top: 3px; }
    .subject.collapsed .subject-body { display: none; }
    .subject-count { font-size: 0.85rem; color: var(--muted); margin-bottom: 10px; white-space: nowrap; }
    .lesson { border: 1px solid var(--border); border-radius: 10px; padding: 12px; margin-bottom: 10px; background: #fafbff; }
    label { display: block; font-size: 0.82rem; color: var(--muted); margin: 8px 0 4px; }
    input, select, textarea {
      width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px;
      font: inherit; background: #fff;
    }
    textarea { min-height: 64px; resize: vertical; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    @media (max-width: 640px) { .row { grid-template-columns: 1fr; } }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
    button {
      border: 0; border-radius: 8px; padding: 8px 14px; font: inherit; cursor: pointer;
    }
    .primary { background: var(--brand); color: #fff; }
    .ghost { background: #fff; border: 1px solid var(--border); }
    .danger { background: #fff; color: #b91c1c; border: 1px solid #fecaca; }
    .save-bar { position: sticky; bottom: 0; background: rgba(244,245,249,.95); padding: 12px 0 0; }
    code { font-size: 0.9em; }
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(15,23,42,.45); z-index: 50;
      display: flex; align-items: center; justify-content: center; padding: 16px;
    }
    .modal-overlay[hidden] { display: none; }
    .modal {
      background: #fff; border-radius: 14px; padding: 18px; max-width: 720px; width: 100%;
      box-shadow: 0 20px 60px rgba(0,0,0,.25);
    }
    .modal h3 { margin: 0 0 6px; }
    .modal textarea { font-family: Consolas, Menlo, monospace; font-size: 0.9rem; }
    .modal .actions { justify-content: flex-end; }
    .match-line { font-size: 0.85rem; margin: 8px 0 0; }
    .match-line.ok { color: #065f46; }
    .match-line.warn { color: #92400e; }
    .batch-files {
      margin-top: 10px; border: 1px solid var(--border); border-radius: 10px;
      max-height: 320px; overflow-y: auto; background: #fff;
    }
    .batch-files label {
      display: flex; gap: 10px; align-items: center; padding: 9px 12px; margin: 0;
      cursor: pointer; border-bottom: 1px solid #f0f1f6; font-size: 0.9rem; color: var(--text);
    }
    .batch-files label:last-child { border-bottom: 0; }
    .batch-files label:hover { background: #f4f6ff; }
    .batch-files input[type=checkbox] { width: auto; flex: none; }
    .batch-actions { display: flex; gap: 8px; align-items: center; margin-top: 10px; }
    .batch-actions .ghost { padding: 5px 12px; font-size: 0.85rem; }
    .batch-actions .sub { margin: 0 0 0 auto; }
    .batch-empty { padding: 24px; text-align: center; color: var(--muted); font-size: 0.9rem; }
    .already-added { color: #92400e; font-size: 0.8em; margin-left: 6px; }
    .batch-group-head {
      position: sticky; top: 0; display: flex; gap: 10px; align-items: center;
      padding: 9px 12px; background: #eef2ff; font-weight: 600; font-size: 0.9rem;
      border-bottom: 1px solid #dfe3f5; cursor: pointer; user-select: none;
    }
    .batch-group-head input[type=checkbox] { width: auto; flex: none; }
    .batch-group-head .group-count { font-weight: 400; color: var(--muted); font-size: 0.82rem; margin-left: auto; }
    .batch-files label.batch-file { padding-left: 34px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>录播课管理</h1>
    <p class="sub">先把视频传到 OSS 的 <code>courses</code> 文件夹，再在这里添加科目、填写课名和明细。</p>
    <div id="status" class="msg">正在检查教师登录…</div>
    <div id="app" hidden>
      <div class="hint">
        科目由老师自己添加（例如听力、阅读、长难句）。保存后学生「录播课」会按这些科目显示。
      </div>
      <div class="toolbar">
        <input id="newSubjectName" type="text" placeholder="新科目名称，例如：长难句">
        <button class="ghost" id="addSubjectBtn" type="button">添加科目</button>
        <button class="ghost" id="toggleAllSubjectsBtn" type="button">全部收起</button>
      </div>
      <div id="subjects"></div>
      <div class="save-bar">
        <button class="primary" id="saveBtn" type="button">保存课表</button>
        <span id="saveMsg" class="sub"></span>
      </div>
    </div>
  </div>

  <div id="batchModal" class="modal-overlay" hidden>
    <div class="modal">
      <h3>批量添加课程：<span id="batchTargetName"></span></h3>
      <p class="sub">勾选要添加的视频，一门课对应一个视频。课名默认取文件名，可勾选后手动修改。</p>
      <input id="batchSearch" type="text" placeholder="搜索文件名过滤…">
      <div class="batch-actions">
        <button class="ghost" id="batchCheckAll" type="button">全选</button>
        <button class="ghost" id="batchCheckNone" type="button">清空</button>
        <span class="sub" id="batchCount">已选 0 个</span>
      </div>
      <div id="batchFiles" class="batch-files"></div>
      <p class="match-line" id="batchMatchLine"></p>
      <div class="actions">
        <button class="primary" id="batchConfirm" type="button">添加</button>
        <button class="ghost" id="batchCancel" type="button">取消</button>
      </div>
    </div>
  </div>
  <script src="/luboke/manage.js?v=20260920fold"></script>
</body>
</html>
