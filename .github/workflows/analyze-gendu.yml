# 一次性只读统计线上跟读得分。不部署、不改数据库。
# 同一篇上的分数跳变和持续低分单独列出。
name: Analyze gendu stability

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - .github/workflows/analyze-gendu.yml

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install paramiko
      - name: Prepare SSH key
        env:
          DEPLOY_KEY: ${{ secrets.IELTS_DEPLOY_KEY }}
        run: |
          if [ -z "$DEPLOY_KEY" ]; then
            echo "Missing GitHub secret IELTS_DEPLOY_KEY" >&2
            exit 1
          fi
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" | tr -d '\r' > "$HOME/.ssh/ielts_deploy.pem"
          chmod 600 "$HOME/.ssh/ielts_deploy.pem"
      - name: Read recent gendu scores
        env:
          IELTS_DEPLOY_HOST: ${{ secrets.IELTS_DEPLOY_HOST }}
          IELTS_DEPLOY_PORT: ${{ secrets.IELTS_DEPLOY_PORT }}
          IELTS_DEPLOY_USER: ${{ secrets.IELTS_DEPLOY_USER }}
          IELTS_DEPLOY_KEY: /home/runner/.ssh/ielts_deploy.pem
        run: |
          if [ -z "$IELTS_DEPLOY_HOST" ]; then
            echo "Missing GitHub secret IELTS_DEPLOY_HOST" >&2
            exit 1
          fi
          export IELTS_DEPLOY_USER="${IELTS_DEPLOY_USER:-root}"
          export IELTS_DEPLOY_PORT="${IELTS_DEPLOY_PORT:-22}"
          python3 - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, "scripts")
          from backup_remote_db import connect_ssh
          ssh = connect_ssh()
          try:
              sftp = ssh.open_sftp()
              sftp.put("scripts/analyze_gendu_stability.py", "/tmp/analyze_gendu_stability.py")
              sftp.close()
              _, stdout, stderr = ssh.exec_command(
                  "python3 /tmp/analyze_gendu_stability.py --db /var/www/ielts/data/ielts_local.db",
                  timeout=180,
              )
              out = stdout.read().decode("utf-8", "replace")
              err = stderr.read().decode("utf-8", "replace")
              code = stdout.channel.recv_exit_status()
              print(out)
              if err.strip():
                  print(err, file=sys.stderr)
              Path("gendu-report.txt").write_text(out, encoding="utf-8")
              if code != 0:
                  raise SystemExit(code)
          finally:
              ssh.close()
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: gendu-stability-report
          path: gendu-report.txt
          retention-days: 3
